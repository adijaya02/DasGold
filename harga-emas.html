<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Emas</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    margin:0;
    padding:0;
    overflow-x:hidden; /* Mencegah geser ke samping */
    width:100%;
    max-width:100%;
    background:#eef2f7;
}

.dashboard{
    display:flex;
    min-height:100vh;
    overflow-x:hidden;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#04264a;
    color:#fff;
    padding:25px 0;
    transition:all .3s ease;
    overflow:hidden;
}

.sidebar.hide{
    width:0;
    padding:0;
}

.logo{
    font-size:28px;
    font-weight:700;
    text-align:center;
    margin-bottom:40px;
    white-space:nowrap;
}

.menu{
    list-style:none;
}

.menu li{
    transition:.3s;
}

.menu li:hover{
    background:#0b4f96;
}

.menu li.active{
    background:#1f86ff;
}

.menu li a{
    display:block;
    padding:16px 30px;
    color:#fff;
    text-decoration:none;
}

/* MAIN */

.main{
    flex:1;
    transition:all .3s ease;
    overflow-x:hidden;
}

/* TOPBAR */

.topbar{
    height:75px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.left-top{
    font-size:26px;
    cursor:pointer;
    user-select:none;
}

.right-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.logout-btn{
    background:#ff4d4d;
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.logout-btn:hover{
    background:#e60000;
}

/* CONTENT */

.content{
    padding:25px;
    overflow-x:hidden;
}

/* CARDS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.card-title{
    color:#777;
    font-size:14px;
}

.card-value{
    font-size:34px;
    font-weight:700;
    margin-top:10px;
    color:#1b1b1b;
}

.card-sub{
    margin-top:12px;
    color:#666;
    font-size:14px;
}

/* HISTORY TABLE */

.month-btn{
    background:#1f86ff;
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.month-btn:hover{
    background:#0b4f96;
}

/* NAVIGASI BULAN */
.month-nav{
    display:flex;
    align-items:center;
    gap:10px;
}
	
.table-container{
    margin-top:25px;
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);

    overflow:hidden;
}

.table-title{
    font-size:18px;
    font-weight:600;
    margin-bottom:15px;
    color:#1b1b1b;
}

.history-table{
    width:100%;
    border-collapse:collapse;
}

.history-table th{
    background:#04264a;
    color:#fff;
    padding:14px;
    text-align:left;
    font-size:14px;
}

.history-table td{
    padding:14px;
    border-bottom:1px solid #e5e5e5;
}

.history-table tr:hover{
    background:#f7f9fc;
}

.sortable{
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
}

.sortable:hover{
    background:#0b4f96;
}

.sortable span{
    margin-left:6px;
    font-size:12px;
}

.mobile-text{
    display:none;
    font-size:20px;
    font-weight:700;
    line-height:1;
}

/* =========================
   TABLET
========================= */
@media (max-width: 1200px){

    .stats{
        grid-template-columns: repeat(2,1fr);
    }

}

/* ===========================
   MOBILE
=========================== */
@media (max-width:768px){

    /* Sidebar */
    .sidebar{
        position:fixed;
        top:0;
        left:0;
        width:220px;
        height:100vh;
        z-index:1001;
        transform:translateX(-100%);
        transition:.3s;
        box-shadow:0 0 25px rgba(0,0,0,.25);
    }

    .sidebar.show{
        transform:translateX(0);
    }

    .sidebar.hide{
        transform:translateX(-100%);
        width:220px;
    }

    .logo{
        font-size:24px;
        margin-bottom:25px;
    }

    .menu li a{
        padding:14px 20px;
        font-size:15px;
    }

    /* Main */
    .main{
        width:100%;
    }

    .topbar{
        padding:0 15px;
    }

    .content{
        padding:12px;
    }

    /* Cards */
    .stats{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .stats .card:first-child{
        grid-column:1 / -1;
    }

    .card{
        padding:16px;
    }

    .card-title{
        font-size:13px;
    }

    .card-value{
        font-size:24px;
    }

    .card-sub{
        font-size:12px;
    }

    .left-top{
        font-size:24px;
    }

    .topbar{
        height:65px;
    }

    /* Table */
    .history-table th,
    .history-table td{
        padding:8px;
        font-size:12px;
    }

    /* Navigasi Bulan */
    .month-nav{
        width:100%;
        display:flex;
        align-items:center;
        gap:10px;
    }

    .month-btn{
        flex:0 0 auto;
        min-width:60px;
        height:44px;
        padding:0 16px;
        border-radius:12px;
        font-size:18px;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    #monthLabel{
        flex:1;
        min-width:0;
        padding:10px 14px;
        font-size:14px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    /* Text tombol */
    .desktop-text{
        display:none;
    }

    .mobile-text{
        display:inline;
    }
}

/* =========================
   EXTRA SMALL DEVICE
========================= */
@media (max-width: 480px){

    .logo{
        font-size:22px;
    }

    .topbar{
        height:65px;
    }

    .left-top{
        font-size:24px;
    }

    .card-title{
        font-size:13px;
    }

    .card-value{
        font-size:24px;
    }

    .card-sub{
        font-size:12px;
    }

}

#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

#overlay.show{
    opacity:1;
    visibility:visible;
}

</style>
</head>

<body>

<div id="overlay"></div>

<div class="dashboard">

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            GoldDash
        </div>

        <ul class="menu">
            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>

            <li class="active">
                <a href="harga-emas.html">Harga Emas</a>
            </li>

            <li>
                <a href="data-emas.html">Data Emas</a>
            </li>

            <li>
                <a href="investasi.html">Investasi</a>
            </li>
        </ul>

    </aside>

    <main class="main">

        <div class="topbar">

            <div class="left-top" id="toggleSidebar">
                ☰
            </div>
			
			<div class="right-top">
				<button class="logout-btn" onclick="logout()">
					Logout
				</button>
			</div>

        </div>
		<div class="content">

				<div class="stats">
					<div class="card">
							<div class="card-title">Tanggal</div>
							<div class="card-value" id="tanggal"></div>
							<div class="card-sub" id="jam"></div>
					</div>

					<div class="card">
						<div class="card-title">Harga Beli</div>
						<div class="card-value" id="hargaBeli">Loading...</div>
						<div class="card-sub">/ 0,01 gr</div>
					</div>

					<div class="card">
						<div class="card-title">Harga Jual</div>
						<div class="card-value" id="hargaJual">Loading...</div>
						<div class="card-sub">/ 0,01 gr</div>
					</div>

				</div>

		</div>

		<div class="table-container">

			<div style="
				display:flex;
				justify-content:space-between;
				align-items:center;
				margin-bottom:15px;
				flex-wrap:wrap;
				gap:10px;
				">
				
				    <div class="table-title">
				        History Harga Emas
				    </div>
				
				    <div class="month-nav">
					
					   <button id="prevMonth" class="month-btn">
						    <span class="desktop-text">
						        ← Bulan Sebelumnya
						    </span>
						
						    <span class="mobile-text">
						        ←
						    </span>
						</button>
					
					    <div
					        id="monthLabel"
					        style="
					        background:#f3f6fa;
					        padding:10px 18px;
					        border-radius:10px;
					        font-weight:600;
					        color:#04264a;
					        min-width:180px;
					        text-align:center;
					        ">
					    </div>
					
					    <button id="nextMonth" class="month-btn">
						    <span class="desktop-text">
						        Bulan Berikutnya →
						    </span>
						
						    <span class="mobile-text">
						        →
						    </span>
						</button>
					
					</div>
				
				</div>

			<table class="history-table">

				<thead>
                    <tr>
                        <th>No</th>

                        <th class="sortable" onclick="sortTable('tanggal')">
                            Hari / Tanggal
                            <span id="icon-tanggal">↕</span>
                        </th>

                        <th class="sortable" onclick="sortTable('harga_beli')">
                            Harga Beli
                            <span id="icon-harga_beli">↕</span>
                        </th>

                        <th class="sortable" onclick="sortTable('harga_jual')">
                            Harga Jual
                            <span id="icon-harga_jual">↕</span>
                        </th>
                    </tr>
                </thead>

				<tbody id="historyBody">
				</tbody>
			</table>

		</div>

    </main>

</div>

<script>

	async function loadHarga() {
		try {
			const res = await fetch('/api/harga');

			const data = await res.json();

			if (!data || !data.harga_beli) return;

			document.getElementById('hargaBeli').innerText =
				'Rp ' + Number(data.harga_beli).toLocaleString('id-ID');

			document.getElementById('hargaJual').innerText =
				'Rp ' + Number(data.harga_jual).toLocaleString('id-ID');

		} catch (err) {
			console.error(err);
		}
	}
	loadHarga();

	let allHistory = [];
	let currentOffset = 0;

    let sortColumn = "tanggal";
    let sortDirection = "desc";
	
	async function loadHistory() {	
	    try {
	
	        const res = await fetch('/api/history');	
	        allHistory = await res.json();
            updateSortIcons();	
	        renderHistory();
            
	    } catch (err) {
	        console.error(err);
	    }
	}

    function sortTable(column){

        if(sortColumn === column){

            sortDirection =
                sortDirection === "asc"
                ? "desc"
                : "asc";

        }else{

            sortColumn = column;
            sortDirection = "asc";

        }

        updateSortIcons();
        renderHistory();

    }

    function updateSortIcons(){

        document.getElementById("icon-tanggal").textContent = "↕";
        document.getElementById("icon-harga_beli").textContent = "↕";
        document.getElementById("icon-harga_jual").textContent = "↕";

        document.getElementById(
            "icon-" + sortColumn
        ).textContent =
            sortDirection === "asc"
            ? "▲"
            : "▼";

    }
	
	function renderHistory() {
	
	    const tbody = document.getElementById("historyBody");
	
	    tbody.innerHTML = "";
	
	    const today = new Date();
	
	    const start = new Date(
	        today.getFullYear(),
	        today.getMonth() - currentOffset,
	        1
	    );
	
	    const end = new Date(
	        today.getFullYear(),
	        today.getMonth() - currentOffset + 1,
	        0,
	        23,
	        59,
	        59
	    );

		const label =
		start.toLocaleDateString(
		    'id-ID',
		    {
		        month:'long',
		        year:'numeric'
		    }
		);
		
		document.getElementById(
		    "monthLabel"
		).textContent =
		`Data ${label}`;
		
	    const filtered = allHistory
	
	        .filter(item => {
	
	            const tgl = new Date(item.tanggal);
	
	            return tgl >= start && tgl <= end;
	
	        })
	
	        .sort((a,b)=>{

                let valueA;
                let valueB;

                if(sortColumn === "tanggal"){

                    valueA = new Date(a.tanggal);
                    valueB = new Date(b.tanggal);

                }else{

                    valueA = Number(a[sortColumn]);
                    valueB = Number(b[sortColumn]);

                }

                if(valueA < valueB)
                    return sortDirection === "asc" ? -1 : 1;

                if(valueA > valueB)
                    return sortDirection === "asc" ? 1 : -1;

                return 0;

            });
	
	    filtered.forEach((item,index)=>{
	
	        const tanggalFormatted =
	        new Date(item.tanggal)
	        .toLocaleDateString(
	            'id-ID',
	            {
	                weekday:'long',
	                day:'numeric',
	                month:'long',
	                year:'numeric'
	            }
	        );
	
	        tbody.innerHTML += `
	            <tr>
	                <td>${index+1}</td>
	
	                <td>
	                    ${tanggalFormatted}
	                </td>
	
	                <td>
	                    Rp ${Number(item.harga_beli)
	                    .toLocaleString('id-ID')}
	                </td>
	
	                <td>
	                    Rp ${Number(item.harga_jual)
	                    .toLocaleString('id-ID')}
	                </td>
	
	            </tr>
	        `;
	
	    });
	
	}

	document
	.getElementById("prevMonth")
	.addEventListener("click",()=>{
	
	    currentOffset++;
	
	    renderHistory();
	
	});
	
	document
	.getElementById("nextMonth")
	.addEventListener("click",()=>{
	
	    if(currentOffset>0){
	
	        currentOffset--;
	
	        renderHistory();
	
	    }
	
	});
	
	loadHistory();
	
    const toggleBtn = document.getElementById("toggleSidebar");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    // Default: desktop sidebar disembunyikan
    if (window.innerWidth > 768) {
        sidebar.classList.add("hide");
    }

    toggleBtn.addEventListener("click", (e) => {

        e.stopPropagation();

        if (window.innerWidth <= 768) {

            sidebar.classList.remove("hide");
            sidebar.classList.toggle("show");
            overlay.classList.toggle("show");

        } else {

            sidebar.classList.toggle("hide");

        }

    });

    window.addEventListener("resize", () => {

        if (window.innerWidth > 768) {

            sidebar.classList.remove("show");
            overlay.classList.remove("show");

            // Desktop selalu default tersembunyi
            sidebar.classList.add("hide");

        } else {

            // Mobile tidak menggunakan class hide
            sidebar.classList.remove("hide");

        }

    });

    overlay.addEventListener("click", () => {

        sidebar.classList.remove("show");
        overlay.classList.remove("show");

    });

    const main = document.querySelector(".main");

        main.addEventListener("click", (e) => {

            // Jangan tutup jika klik di dalam sidebar
            if (sidebar.contains(e.target)) return;

            if (window.innerWidth > 768) {

                sidebar.classList.add("hide");

            } else {

                sidebar.classList.remove("show");
                overlay.classList.remove("show");

            }

        });

	function updatePerthTime(){

		const now = new Date();

		const tanggal = now.toLocaleDateString('id-ID',{
			timeZone:'Australia/Perth',
			day:'numeric',
			month:'long',
			year:'numeric'
		});

		const perthTime = new Date(
		now.toLocaleString('en-US', {
			timeZone:'Australia/Perth'
		})
	);

	const jam = [
		perthTime.getHours(),
		perthTime.getMinutes(),
		perthTime.getSeconds()
	]
	.map(v => String(v).padStart(2,'0'))
	.join(' : ');

		document.getElementById('tanggal').textContent = tanggal;
		document.getElementById('jam').textContent = jam;
	}

	updatePerthTime();
	setInterval(updatePerthTime,1000);
	
	function logout(){
		// kalau pakai login sederhana, langsung redirect
		window.location.href = "login.html";
	}
	
</script>


</body>
</html>
