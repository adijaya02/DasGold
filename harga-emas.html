<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harga Emas - GoldDash</title>
<script src="auth-guard.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --navy-dark:#021830;
    --navy-main:#04264a;
    --navy-light:#0b3b6e;
    --accent-blue:#1f86ff;
    --accent-blue-hover:#0b6ce0;
    --accent-gold:#f59e0b;
    --bg-page:#f1f5f9;
    --bg-card:#ffffff;
    --text-primary:#0f172a;
    --text-secondary:#475569;
    --text-muted:#94a3b8;
    --border-light:#e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    margin:0;
    padding:0;
    overflow-x:hidden;
    width:100%;
    max-width:100%;
    background:var(--bg-page);
    color:var(--text-primary);
    -webkit-font-smoothing:antialiased;
}

.num-tabular{
    font-variant-numeric:tabular-nums;
}

.dashboard{
    display:flex;
    min-height:100vh;
}

/* =====================================================
   SIDEBAR
===================================================== */
.sidebar{
    position:sticky;
    top:0;
    height:100vh;
    width:260px;
    background:linear-gradient(180deg, var(--navy-main) 0%, var(--navy-dark) 100%);
    color:#fff;
    padding:24px 0;
    transition:all .3s cubic-bezier(.4, 0, .2, 1);
    overflow:hidden;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    border-right:1px solid rgba(255,255,255,.06);
}

.sidebar.hide{
    width:0;
    padding:0;
    border-right:none;
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-size:24px;
    font-weight:700;
    letter-spacing:-0.4px;
    padding:4px 20px 26px;
    margin-bottom:16px;
    border-bottom:1px solid rgba(255,255,255,.08);
    white-space:nowrap;
}

.logo-badge{
    width:38px;
    height:38px;
    border-radius:11px;
    background:linear-gradient(135deg, rgba(245,158,11,.22), rgba(31,134,255,.22));
    border:1px solid rgba(251,191,36,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.logo span{
    color:#fbbf24;
}

.menu-label{
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:1.1px;
    color:rgba(255,255,255,.4);
    padding:0 26px;
    margin-bottom:10px;
    white-space:nowrap;
}

.menu{
    list-style:none;
    padding:0 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu li{
    border-radius:12px;
    transition:all .25s ease;
}

.menu li:hover{
    background:rgba(255,255,255,.08);
}

.menu li.active{
    background:linear-gradient(135deg, #1f86ff, #0b6ce0);
    box-shadow:0 8px 20px rgba(31,134,255,.32);
}

.menu li a{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 16px;
    color:rgba(255,255,255,.82);
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    white-space:nowrap;
    transition:.2s;
}

.menu li:hover a,
.menu li.active a{
    color:#ffffff;
}

.menu li.active a{
    font-weight:600;
}

.menu-icon{
    width:19px;
    height:19px;
    flex-shrink:0;
    opacity:.85;
}

.menu li.active .menu-icon{
    opacity:1;
}

.sidebar-footer{
    margin-top:auto;
    padding:16px 20px 0;
    border-top:1px solid rgba(255,255,255,.08);
}

.sidebar-note{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:12px 14px;
    font-size:12px;
    color:rgba(255,255,255,.65);
    line-height:1.5;
    white-space:normal;
    min-width:218px;
}

.sidebar-note strong{
    display:block;
    color:#fbbf24;
    font-size:12.5px;
    margin-bottom:2px;
}

/* =====================================================
   MAIN & TOPBAR
===================================================== */
.main{
    flex:1;
    min-width:0;
    transition:all .3s ease;
    display:flex;
    flex-direction:column;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    height:74px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border-light);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:16px;
}

.left-top{
    width:40px;
    height:40px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    background:#f8fafc;
    border:1px solid var(--border-light);
    color:var(--text-primary);
    transition:.2s;
}

.left-top:hover{
    background:#eef2f7;
    border-color:#cbd5e1;
}

.page-title-wrap h1{
    font-size:19px;
    font-weight:700;
    color:var(--text-primary);
    line-height:1.2;
}

.page-title-wrap p{
    font-size:12.5px;
    color:var(--text-secondary);
    margin-top:2px;
}

.right-top{
    display:flex;
    align-items:center;
    gap:14px;
}

.logout-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fff1f2;
    color:#e11d48;
    border:1px solid #fecdd3;
    padding:9px 16px;
    border-radius:10px;
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    transition:all .2s ease;
}

.logout-btn:hover{
    background:#e11d48;
    color:#ffffff;
    border-color:#e11d48;
    box-shadow:0 6px 16px rgba(225,29,72,.24);
}

/* =====================================================
   CONTENT & STAT CARDS
===================================================== */
.content{
    padding:26px 28px 36px;
    max-width:1480px;
    width:100%;
    margin:0 auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:var(--bg-card);
    border-radius:18px;
    padding:22px;
    border:1px solid var(--border-light);
    box-shadow:0 4px 20px rgba(15,23,42,.035);
    transition:transform .25s ease, box-shadow .25s ease;
    position:relative;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(15,23,42,.07);
}

.card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.card-title{
    color:var(--text-secondary);
    font-size:13.5px;
    font-weight:600;
}

.card-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.icon-gold{
    background:#fffbeb;
    color:#d97706;
}

.icon-blue{
    background:#eff6ff;
    color:#2563eb;
}

.icon-emerald{
    background:#ecfdf5;
    color:#059669;
}

.card-value{
    font-size:clamp(22px, 1.9vw, 28px);
    font-weight:700;
    margin-top:14px;
    color:var(--text-primary);
    letter-spacing:-0.4px;
    line-height:1.25;
}

.price-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    margin-top:14px;
    flex-wrap:wrap;
}

.price-row .card-value{
    margin-top:0;
}

.price-unit{
    font-size:12.5px;
    color:var(--text-muted);
    font-weight:500;
}

.card-sub{
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed #e2e8f0;
    color:var(--text-secondary);
    font-size:12.5px;
    display:flex;
    align-items:center;
    gap:8px;
}

.live-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#10b981;
    box-shadow:0 0 0 3px rgba(16,185,129,.2);
    flex-shrink:0;
}

.clock-text{
    font-weight:600;
    color:var(--text-primary);
    letter-spacing:0.3px;
}

/* Shimmer Skeleton */
.skeleton{
    display:inline-block;
    height:28px;
    width:150px;
    border-radius:8px;
    background:linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
    vertical-align:middle;
}

@keyframes shimmer{
    0%{ background-position:200% 0; }
    100%{ background-position:-200% 0; }
}

/* =====================================================
   HISTORY TABLE CONTAINER
===================================================== */
.table-container{
    margin-top:24px;
    background:var(--bg-card);
    border-radius:20px;
    padding:26px;
    border:1px solid var(--border-light);
    box-shadow:0 4px 20px rgba(15,23,42,.035);
}

.table-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    padding-bottom:18px;
    border-bottom:1px solid #f1f5f9;
    flex-wrap:wrap;
    gap:14px;
}

.table-title-wrap{
    display:flex;
    align-items:center;
    gap:10px;
}

.title-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--accent-blue);
    box-shadow:0 0 0 4px rgba(31,134,255,.16);
}

.table-title{
    font-size:17px;
    font-weight:700;
    color:var(--text-primary);
}

.record-badge{
    font-size:12px;
    font-weight:600;
    color:var(--accent-blue);
    background:#eff6ff;
    border:1px solid #dbeafe;
    padding:3px 10px;
    border-radius:20px;
}

.month-nav{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#f1f5f9;
    padding:5px;
    border-radius:13px;
    border:1px solid var(--border-light);
}

.month-btn{
    background:#ffffff;
    color:var(--text-primary);
    border:1px solid var(--border-light);
    padding:8px 14px;
    border-radius:9px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    transition:all .2s ease;
    box-shadow:0 1px 3px rgba(15,23,42,.05);
}

.month-btn:hover:not(:disabled){
    background:var(--accent-blue);
    color:#ffffff;
    border-color:var(--accent-blue);
}

.month-btn:disabled{
    background:transparent;
    border-color:transparent;
    box-shadow:none;
    color:var(--text-muted);
    cursor:not-allowed;
}

.month-label{
    padding:8px 16px;
    font-size:13.5px;
    font-weight:700;
    color:var(--navy-main);
    min-width:175px;
    text-align:center;
}

.table-responsive{
    width:100%;
    overflow-x:auto;
    border:1px solid var(--border-light);
    border-radius:14px;
}

.history-table{
    width:100%;
    border-collapse:collapse;
}

.history-table th{
    background:#f8fafc;
    color:var(--text-secondary);
    padding:14px 16px;
    text-align:left;
    font-size:12.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.4px;
    border-bottom:1px solid var(--border-light);
    white-space:nowrap;
}

.history-table td{
    padding:14px 16px;
    border-bottom:1px solid #f1f5f9;
    font-size:14px;
    color:var(--text-primary);
}

.history-table tbody tr:last-child td{
    border-bottom:none;
}

.history-table tbody tr{
    transition:background .15s ease;
}

.history-table tbody tr:hover{
    background:#f8fafc;
}

.row-num{
    color:var(--text-muted);
    font-weight:600;
    font-size:13px;
    width:60px;
}

.price-cell{
    font-weight:600;
    color:var(--text-primary);
}

.empty-row{
    text-align:center;
    padding:36px 20px !important;
    color:var(--text-secondary);
    font-size:14px;
}

.sortable{
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    transition:color .2s, background .2s;
}

.sortable:hover{
    background:#f1f5f9;
    color:var(--accent-blue);
}

.sort-pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-left:6px;
    width:20px;
    height:20px;
    border-radius:6px;
    background:#e2e8f0;
    color:var(--text-secondary);
    font-size:11px;
    transition:.2s;
}

.sortable:hover .sort-pill{
    background:#dbeafe;
    color:var(--accent-blue);
}

.mobile-text{
    display:none;
    font-size:18px;
    font-weight:700;
    line-height:1;
}

/* =====================================================
   TABLET
===================================================== */
@media (max-width: 1200px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stats .card:first-child{
        grid-column:1 / -1;
    }
}

/* =====================================================
   MOBILE
===================================================== */
@media (max-width:768px){
    .dashboard{
        flex-direction:column;
    }

    .sidebar{
        position:fixed;
        top:0;
        left:0;
        width:245px;
        height:100vh;
        z-index:1001;
        transform:translateX(-100%);
        transition:.3s ease;
        box-shadow:0 0 30px rgba(2,24,48,.35);
    }

    .sidebar.show{
        transform:translateX(0);
    }

    .sidebar.hide{
        transform:translateX(-100%);
        width:245px;
    }

    .topbar{
        height:66px;
        padding:0 16px;
    }

    .page-title-wrap h1{
        font-size:17px;
    }

    .page-title-wrap p{
        display:none;
    }

    .content{
        padding:16px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .stats .card:first-child{
        grid-column:1 / -1;
    }

    .card{
        padding:16px;
    }

    .card-title{
        font-size:12.5px;
    }

    .card-value{
        font-size:21px;
    }

    .table-container{
        margin-top:16px;
        padding:16px;
        border-radius:16px;
    }

    .history-table th,
    .history-table td{
        padding:11px 10px;
        font-size:12.5px;
    }

    .month-nav{
        width:100%;
        display:flex;
        align-items:center;
        gap:6px;
    }

    .month-btn{
        flex:0 0 auto;
        min-width:44px;
        height:38px;
        padding:0 12px;
        border-radius:9px;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .month-label{
        flex:1;
        min-width:0;
        padding:8px 10px;
        font-size:13px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .desktop-text{
        display:none;
    }

    .mobile-text{
        display:inline;
    }
}

/* =====================================================
   EXTRA SMALL DEVICE
===================================================== */
@media (max-width: 480px){
    .logout-btn span{
        display:none;
    }

    .logout-btn{
        padding:9px 11px;
    }

    .card-value{
        font-size:19px;
    }
}

#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(2,24,48,.5);
    backdrop-filter:blur(2px);
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

#overlay.show{
    opacity:1;
    visibility:visible;
}
</style>
</head>
