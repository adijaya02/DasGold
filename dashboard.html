<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Emas</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#eef2f7;
}

.dashboard{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:#04264a;
    color:#fff;
    padding:25px 0;
    transition:all .3s ease;
    overflow:hidden;
    flex-shrink:0;
}

.sidebar.hide{
    width:0;
    padding:0;
}

.logo{
    font-size:28px;
    font-weight:700;
    text-align:center;
    margin-bottom:40px;
    white-space:nowrap;
}

.menu{
    list-style:none;
}

.menu li{
    transition:.3s;
}

.menu li:hover{
    background:#0b4f96;
}

.menu li.active{
    background:#1f86ff;
}

.menu li a{
    display:block;
    padding:16px 30px;
    color:#fff;
    text-decoration:none;
    white-space:nowrap;
}

/* MAIN */
.main{
    flex:1;
    min-width:0;
    transition:all .3s ease;
}

/* TOPBAR */
.topbar{
    height:75px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.left-top{
    font-size:26px;
    cursor:pointer;
    user-select:none;
    background:none;
    border:none;
    color:#1b1b1b;
}

.right-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.logout-btn{
    background:#ff4d4d;
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.logout-btn:hover{
    background:#e60000;
}

/* CONTENT */
.content{
    padding:25px;
}

/* CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.card-title{
    color:#777;
    font-size:14px;
}

.card-value{
    font-size:34px;
    font-weight:700;
    margin-top:10px;
    color:#1b1b1b;
}

.price-row{
    display:flex;
    align-items:flex-end;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
}

.price-row .card-value{
    margin-top:0;
}

.price-unit{
    font-size:13px;
    color:#666;
    font-weight:500;
    margin-bottom:6px;
}

.card-sub{
    margin-top:12px;
    color:#666;
    font-size:14px;
}

/* PANEL */
.panel{
    margin-top:25px;
    background:#fff;
    border-radius:14px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.tabs{
    display:flex;
    gap:20px;
}

.tab{
    cursor:pointer;
    color:#666;
}

.tab.active{
    color:#1f86ff;
    font-weight:600;
}

.filter{
    display:flex;
    gap:15px;
}

.filter button{
    border:none;
    background:#f4f6fa;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

.filter button:hover{
    background:#dfe8f5;
}

.filter button.active{
    background:#1f86ff;
    color:#fff;
}

.chart-area{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
}

.chart-box{
    position:relative;
    height:380px;
    min-width:0;
    background:#fff;
    padding:15px;
}

.ranking{
    min-width:0;
    background:#f7f9fc;
    border-radius:10px;
    padding:20px;
}

.ranking-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.ranking-header h3{
    margin:0;
}

#tanggalRingkasan{
    font-size:13px;
    color:#666;
    font-weight:500;
}

.rank-item{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #e5e5e5;
}

.rank-item:last-child{
    border-bottom:none;
}

/* =========================
   TABLET
========================= */
@media (max-width: 1200px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .chart-area{
        grid-template-columns:1fr;
    }
}

/* =========================
   MOBILE
========================= */
@media (max-width:768px){
    .dashboard{
        flex-direction:column;
    }

    .sidebar{
        position:fixed;
        top:0;
        left:0;
        width:220px;
        height:100vh;
        z-index:1001;
        transform:translateX(-100%);
        transition:.3s;
        box-shadow:0 0 25px rgba(0,0,0,.25);
    }

    .sidebar.show{
        transform:translateX(0);
    }

    .sidebar.hide{
        transform:translateX(-100%);
        width:220px;
    }

    .logo{
        font-size:24px;
        margin-bottom:25px;
    }

    .menu li a{
        padding:14px 20px;
        font-size:15px;
    }

    .main{
        width:100%;
    }

    .topbar{
        padding:0 15px;
    }

    .content{
        padding:12px;
    }

    .stats{
        grid-template-columns:1fr;
        gap:12px;
    }

    .card{
        padding:16px;
    }

    .card-value{
        font-size:24px;
    }

    .price-unit{
        font-size:13px;
    }

    .panel{
        padding:15px;
    }

    .panel-header{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }

    .tabs{
        width:100%;
    }

    .filter{
        width:100%;
        flex-wrap:wrap;
    }

    .filter button{
        flex:1;
        min-width:90px;
    }

    .chart-area{
        grid-template-columns:1fr;
        gap:15px;
    }

    .chart-box{
        height:240px;
    }

    .ranking{
        padding:15px;
    }

    .ranking-header{
        flex-direction:column;
        align-items:flex-start;
        gap:4px;
    }

    #tanggalRingkasan{
        text-align:left;
        font-size:12px;
    }

    .rank-item{
        font-size:14px;
    }
}

/* =========================
   EXTRA SMALL DEVICE
========================= */
@media (max-width: 480px){
    .logo{
        font-size:22px;
    }

    .topbar{
        height:65px;
    }

    .left-top{
        font-size:24px;
    }

    .card-title{
        font-size:13px;
    }

    .card-value{
        font-size:24px;
    }

    .card-sub{
        font-size:12px;
    }

    .panel{
        padding:15px;
    }
}

#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

#overlay.show{
    opacity:1;
    visibility:visible;
}
</style>
</head>

<body>

<div id="overlay"></div>

<div class="dashboard">

    <aside class="sidebar" id="sidebar">
        <div class="logo">GoldDash</div>

        <ul class="menu">
            <li class="active">
                <a href="dashboard.html">Dashboard</a>
            </li>
            <li>
                <a href="harga-emas.html">Harga Emas</a>
            </li>
            <li>
                <a href="data-emas.html">Data Emas</a>
            </li>
            <li>
                <a href="investasi.html">Investasi</a>
            </li>            
        </ul>
    </aside>

    <main class="main">

        <div class="topbar">
            <button type="button" class="left-top" id="toggleSidebar" aria-label="Toggle Menu">
                ☰
            </button>
            
            <div class="right-top">
                <button type="button" class="logout-btn" onclick="logout()">
                    Logout
                </button>
            </div>
        </div>

        <div class="content">

            <div class="stats">
                <div class="card">
                    <div class="card-title">Harga Beli</div>
                    <div class="price-row">
                        <div class="card-value" id="hargaBeli">Loading...</div>
                        <span class="price-unit">/ 0,01 gr</span>
                    </div>
                    <div class="card-sub" id="tanggalHarga">Loading...</div>
                </div>
                    
                <div class="card">
                    <div class="card-title">Harga Jual</div>
                    <div class="price-row">
                        <div class="card-value" id="hargaJual">Loading...</div>
                        <span class="price-unit">/ 0,01 gr</span>
                    </div>
                    <div class="card-sub" id="tanggalHarga2">Loading...</div>
                </div>

                <div class="card">
                    <div class="card-title">Berat</div>
                    <div class="card-value" id="berat">0,0000 gr</div>
                    <div class="card-sub">Total Aset</div>
                </div>
                
                <div class="card">
                    <div class="card-title">Saldo</div>
                    <div class="card-value" id="saldo">Rp 0</div>
                    <div class="card-sub" id="tanggalSaldo">Loading...</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="tabs">
                        <div class="tab active">Profit</div>
                    </div>

                    <div class="filter">
                        <button type="button" data-filter="7">7 Hari</button>
                        <button type="button" class="active" data-filter="30">30 Hari</button>
                        <button type="button" data-filter="365">1 Tahun</button>
                        <button type="button" data-filter="all">Semua Data</button>
                    </div>
                </div>

                <div class="chart-area">
                    <div class="chart-box">
                        <canvas id="goldChart"></canvas>
                    </div>

                    <div class="ranking">
                        <div class="ranking-header">
                            <h3>Ringkasan</h3>
                            <span id="tanggalRingkasan">-</span>
                        </div>
                            
                        <div class="rank-item">
                            <span>Profit</span>
                            <strong id="profit">Rp 0</strong>
                        </div>
                        
                        <div class="rank-item">
                            <span>Modal</span>
                            <strong id="modal">Rp 0</strong>
                        </div>
                        
                        <div class="rank-item">
                            <span>Uang di Aplikasi</span>
                            <strong id="uangApp">Rp 0</strong>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<script>
    // Helper Formatters
    function formatRupiah(n, round = true) {
        const num = Number(n) || 0;
        const val = round ? Math.round(num) : num;
        return "Rp " + val.toLocaleString("id-ID");
    }

    function formatGram(n) {
        return (Number(n) || 0).toFixed(4).replace(".", ",");
    }

    // Sidebar & Navigasi
    const toggleBtn = document.getElementById("toggleSidebar");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const main = document.querySelector(".main");
    let lastWindowWidth = window.innerWidth;

    if (window.innerWidth > 768) {
        sidebar.classList.add("hide");
    }

    toggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (window.innerWidth <= 768) {
            sidebar.classList.remove("hide");
            sidebar.classList.toggle("show");
            overlay.classList.toggle("show");
        } else {
            sidebar.classList.toggle("hide");
        }
    });

    window.addEventListener("resize", () => {
        if (window.innerWidth === lastWindowWidth) return;
        lastWindowWidth = window.innerWidth;

        if (window.innerWidth > 768) {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
            sidebar.classList.add("hide");
        } else {
            sidebar.classList.remove("hide");
        }
    });

    overlay.addEventListener("click", () => {
        sidebar.classList.remove("show");
        overlay.classList.remove("show");
    });

    main.addEventListener("click", (e) => {
        if (sidebar.contains(e.target)) return;

        if (window.innerWidth > 768) {
            sidebar.classList.add("hide");
        } else {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
        }
    });

    function logout() {
        window.location.href = "login.html";
    }

    // Load Harga Emas
    async function loadHarga() {
        try {
            const res = await fetch("/api/harga");
            if (!res.ok) throw new Error("Gagal memuat harga");
            const data = await res.json();

            if (!data || !data.harga_beli) {
                throw new Error("Data harga kosong");
            }

            document.getElementById("hargaBeli").innerText = formatRupiah(data.harga_beli, false);
            document.getElementById("hargaJual").innerText = formatRupiah(data.harga_jual, false);

            const tanggal = new Date(data.tanggal).toLocaleDateString("id-ID", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            document.getElementById("tanggalHarga").innerText = tanggal;
            document.getElementById("tanggalHarga2").innerText = tanggal;
        } catch (err) {
            console.error(err);
            document.getElementById("hargaBeli").innerText = "Rp 0";
            document.getElementById("hargaJual").innerText = "Rp 0";
            document.getElementById("tanggalHarga").innerText = "-";
            document.getElementById("tanggalHarga2").innerText = "-";
        }
    }

    // State Global Aset & Chart
    let asetData = [];
    let goldChartInstance = null;
    const canvas = document.getElementById("goldChart");

    function renderChart(filter = "30") {
        if (!asetData.length) return;

        let filteredData = [];

        if (filter === "all") {
            filteredData = [...asetData];
        } else {
            const latestDate = new Date(asetData[asetData.length - 1].tanggal_aset);
            latestDate.setHours(23, 59, 59, 999);

            const startDate = new Date(latestDate);
            startDate.setDate(startDate.getDate() - (Number(filter) - 1));
            startDate.setHours(0, 0, 0, 0);

            filteredData = asetData.filter(item => {
                const tgl = new Date(item.tanggal_aset);
                return tgl >= startDate && tgl <= latestDate;
            });
        }

        const labels = filteredData.map(item =>
            new Date(item.tanggal_aset).toLocaleDateString("id-ID", {
                day: "2-digit",
                month: "short"
            })
        );

        const profitData = filteredData.map(item => Number(item.untung_rugi || 0));
        const lastProfit = profitData.length ? profitData[profitData.length - 1] : 0;
        const lineColor = lastProfit >= 0 ? "#16a34a" : "#e53935";
        const fillColor = lastProfit >= 0 ? "rgba(22,163,74,.15)" : "rgba(229,57,53,.15)";

        if (goldChartInstance) {
            goldChartInstance.destroy();
        }

        goldChartInstance = new Chart(canvas, {
            type: "line",
            data: {
                labels,
                datasets: [{
                    label: "Profit",
                    data: profitData,
                    borderColor: lineColor,
                    backgroundColor: fillColor,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: (context) => "Profit: " + formatRupiah(context.parsed.y)
                        }
                    }
                },
                scales: {
                    y: {
                        ticks: {
                            callback: value => formatRupiah(value)
                        }
                    }
                }
            }
        });
    }

    // Load Data Aset Sekali untuk Card, Ringkasan, dan Chart
    async function initAsetDashboard() {
        try {
            const res = await fetch("/api/data-aset");
            if (!res.ok) throw new Error("Gagal memuat data aset");
            const data = await res.json();

            if (!Array.isArray(data) || !data.length) {
                document.getElementById("tanggalSaldo").innerText = "-";
                return;
            }

            // Urutkan ascending berdasarkan tanggal_aset
            asetData = data.sort((a, b) => new Date(a.tanggal_aset) - new Date(b.tanggal_aset));

            // Ambil data terbaru (elemen terakhir)
            const latest = asetData[asetData.length - 1];
            const tanggal = new Date(latest.tanggal_aset).toLocaleDateString("id-ID", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            // Update Card
            document.getElementById("berat").innerText = formatGram(latest.total_aset) + " gr";
            document.getElementById("saldo").innerText = formatRupiah(latest.jumlah_uang_aplikasi);
            document.getElementById("tanggalSaldo").innerText = tanggal;

            // Update Ringkasan
            document.getElementById("tanggalRingkasan").innerText = tanggal;
            document.getElementById("profit").innerText = formatRupiah(latest.untung_rugi);
            document.getElementById("modal").innerText = formatRupiah(latest.total_modal);
            document.getElementById("uangApp").innerText = formatRupiah(latest.jumlah_uang_aplikasi);

            const profitEl = document.getElementById("profit");
            profitEl.style.color = Number(latest.untung_rugi || 0) >= 0 ? "#16a34a" : "#e53935";

            // Render chart sesuai tombol filter yang aktif
            const activeBtn = document.querySelector(".filter button.active");
            renderChart(activeBtn ? activeBtn.dataset.filter : "30");
        } catch (err) {
            console.error(err);
            document.getElementById("tanggalSaldo").innerText = "-";
        }
    }

    // Event Tombol Filter Chart
    const filterButtons = document.querySelectorAll(".filter button");
    filterButtons.forEach(button => {
        button.addEventListener("click", () => {
            filterButtons.forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");
            renderChart(button.dataset.filter);
        });
    });

    // Jalankan inisialisasi saat halaman siap
    loadHarga();
    initAsetDashboard();
</script>
</body>
</html>
