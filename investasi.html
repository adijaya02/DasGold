<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investasi Emas - GoldDash</title>
<script src="auth-guard.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#eef2f7;
}

.dashboard{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    position:sticky;
    top:0;
    height:100vh;
    width:260px;
    background:#04264a;
    color:#fff;
    padding:25px 0;
    transition:all .3s ease;
    overflow:hidden;
    flex-shrink:0;
}

.sidebar.hide{
    width:0;
    padding:0;
}

.logo{
    font-size:28px;
    font-weight:700;
    text-align:center;
    margin-bottom:40px;
    white-space:nowrap;
}

.menu{
    list-style:none;
}

.menu li{
    transition:.3s;
}

.menu li:hover{
    background:#0b4f96;
}

.menu li.active{
    background:#1f86ff;
}

.menu li a{
    display:block;
    padding:16px 30px;
    color:#fff;
    text-decoration:none;
    white-space:nowrap;
}

/* MAIN */
.main{
    flex:1;
    min-width:0;
    transition:all .3s ease;
}

/* TOPBAR */
.topbar{
    height:75px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.left-top{
    font-size:26px;
    cursor:pointer;
    user-select:none;
    background:none;
    border:none;
    color:#1b1b1b;
}

.right-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.logout-btn{
    background:#ff4d4d;
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.logout-btn:hover{
    background:#e60000;
}

/* CONTENT */
.content{
    padding:30px;
}

.purchase-card{
    background:#fff;
    border-radius:20px;
    padding:35px;
    max-width:1400px;
    margin:auto;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.header-form{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    gap:15px;
}

.header-form h1{
    color:#04264a;
    font-size:32px;
}

.tanggal-display{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:#f3f6fa;
    padding:10px 16px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

.tanggal-display:hover{
    background:#e6eef8;
}

#tanggalText{
    font-size:20px;
    font-weight:600;
    color:#04264a;
}

#calendarBtn{
    border:none;
    background:none;
    cursor:pointer;
    font-size:22px;
    line-height:1;
}

#tanggalPembelian{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
    z-index:2;
}

#tanggalPembelian::-webkit-calendar-picker-indicator{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    cursor:pointer;
}

/* PRICE BOXES */
.price-boxes{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-bottom:30px;
}

.price-card{
    border:2px solid #d9e1ec;
    border-radius:14px;
    padding:20px;
}

.price-card h3{
    margin-bottom:10px;
    color:#04264a;
}

.card-value{
    font-size:34px;
    font-weight:700;
    margin-top:6px;
    color:#1f86ff;
}

.harga-status{
    font-size:12px;
    margin-top:6px;
    font-weight:500;
    color:#64748b;
    min-height:18px;
}

.manual-price{
    margin-top:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.manual-price input{
    flex:1;
    min-width:180px;
    padding:10px 12px;
    border:1px solid #d9e1ec;
    border-radius:10px;
    font-size:14px;
}

.manual-price button{
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.2s;
}

#editHargaBtn{
    background:#1f86ff;
    color:#fff;
}

#editHargaBtn:hover{
    background:#0b4f96;
}

#saveHargaBtn{
    background:#14b85a;
    color:#fff;
}

#saveHargaBtn:hover{
    background:#0f9648;
}

#resetHargaBtn{
    background:#e2e8f0;
    color:#1b1b1b;
}

#resetHargaBtn:hover{
    background:#cbd5e1;
}

/* CALCULATOR BOX */
.calculator-box{
    border:2px solid #d9e1ec;
    border-radius:15px;
    overflow:hidden;
    margin-bottom:25px;
}

.tab-menu{
    display:flex;
}

.tab-btn{
    flex:1;
    padding:18px;
    border:none;
    background:#eef2f7;
    color:#475569;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    transition:.2s;
}

.tab-btn.active{
    background:#1f86ff;
    color:#fff;
}

.tab-content{
    padding:25px;
}

.tab-content input{
    width:100%;
    padding:15px;
    border:1px solid #d6dce5;
    border-radius:10px;
    font-size:16px;
}

.tab-content input:focus{
    outline:none;
    border-color:#1f86ff;
}

.quick-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #e2e8f0;
}

.quick-buttons button{
    min-width:85px;
    height:50px;
    border:none;
    background:#1f86ff;
    color:#fff;
    padding:12px 24px;
    border-radius:30px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
    transition:.2s;
}

.quick-buttons button:hover{
    background:#0b4f96;
}

/* TOTAL BOX */
.total-box{
    border:2px solid #d9e1ec;
    border-radius:14px;
    text-align:center;
    padding:25px;
    background:#f8fafc;
}

.total-title{
    font-size:18px;
    font-weight:600;
    color:#64748b;
    margin-bottom:8px;
}

.total-value{
    font-size:42px;
    font-weight:700;
    color:#04264a;
}

/* ACTION BUTTONS */
.action-buttons{
    display:flex;
    justify-content:flex-end;
    gap:15px;
    margin-top:30px;
}

.save-btn,
.reset-btn{
    border:none;
    padding:15px 36px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    font-size:15px;
    transition:.2s;
}

.save-btn{
    background:#1f86ff;
    color:#fff;
}

.save-btn:hover:not(:disabled){
    background:#0b4f96;
}

.save-btn:disabled{
    background:#93c5fd;
    cursor:not-allowed;
}

.reset-btn{
    background:#e2e8f0;
    color:#1b1b1b;
}

.reset-btn:hover{
    background:#cbd5e1;
}

#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

#overlay.show{
    opacity:1;
    visibility:visible;
}

/* =========================
   MOBILE
========================= */
@media (max-width:768px){
    .dashboard{
        flex-direction:column;
    }

    .sidebar{
        position:fixed;
        top:0;
        left:0;
        width:220px;
        height:100vh;
        z-index:1001;
        transform:translateX(-100%);
        transition:.3s;
        box-shadow:0 0 25px rgba(0,0,0,.25);
    }

    .sidebar.show{
        transform:translateX(0);
    }

    .sidebar.hide{
        transform:translateX(-100%);
        width:220px;
    }

    .logo{
        font-size:24px;
        margin-bottom:25px;
    }

    .menu li a{
        padding:14px 20px;
        font-size:15px;
    }

    .main{
        width:100%;
    }

    .topbar{
        height:65px;
        padding:0 15px;
    }

    .left-top{
        font-size:24px;
    }

    .content{
        padding:12px;
    }

    .purchase-card{
        padding:20px;
        border-radius:16px;
    }

    .header-form{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
        margin-bottom:20px;
    }

    .header-form h1{
        font-size:24px;
    }

    #tanggalText{
        font-size:16px;
    }

    .price-boxes{
        grid-template-columns:1fr;
        gap:15px;
        margin-bottom:20px;
    }

    .card-value{
        font-size:26px;
    }

    .tab-content{
        padding:18px;
    }

    .quick-buttons{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .quick-buttons button{
        width:100%;
        height:48px;
        border-radius:12px;
        min-width:0;
    }

    .total-value{
        font-size:28px;
    }

    .action-buttons{
        justify-content:stretch;
    }

    .save-btn,
    .reset-btn{
        flex:1;
        padding:14px 20px;
    }
}

/* =========================
   EXTRA SMALL DEVICE
========================= */
@media (max-width:480px){
    .logo{
        font-size:22px;
    }

    .card-value{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div id="overlay"></div>

<div class="dashboard">

    <aside class="sidebar" id="sidebar">
        <div class="logo">GoldDash</div>

        <ul class="menu">
            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>
            <li>
                <a href="harga-emas.html">Harga Emas</a>
            </li>
            <li>
                <a href="data-emas.html">Data Emas</a>
            </li>
            <li class="active">
                <a href="investasi.html">Investasi</a>
            </li>           
        </ul>
    </aside>

    <main class="main">

        <div class="topbar">
            <button type="button" class="left-top" id="toggleSidebar" aria-label="Toggle Menu">
                ☰
            </button>

            <div class="right-top">
                <button type="button" class="logout-btn" onclick="logout()">
                    Logout
                </button>
            </div>
        </div>
    
        <div class="content">
            <div class="purchase-card">

                <div class="header-form">
                    <h1>Form Pembelian Emas</h1>

                    <div class="tanggal-display" title="Klik untuk ubah tanggal">
                        <span id="tanggalText"></span>
                        <button type="button" id="calendarBtn" aria-label="Pilih Tanggal">📅</button>
                        <input type="date" id="tanggalPembelian">
                    </div>
                </div>

                <div class="price-boxes">
                    <div class="price-card">
                        <h3>Harga 0,01 Gram</h3>
                        <div class="card-value" id="hargaBeli">Loading...</div>
                        <div class="harga-status" id="hargaStatus">Memuat data harga...</div>
                        <div class="manual-price">
                            <input
                                type="number"
                                id="manualHarga"
                                min="0"
                                step="any"
                                placeholder="Masukkan harga 0,01 gr"
                                style="display:none;">
                            <button type="button" id="editHargaBtn">Edit Manual</button>
                            <button type="button" id="saveHargaBtn" style="display:none;">Simpan</button>
                            <button type="button" id="resetHargaBtn" style="display:none;">Auto</button>
                        </div>
                    </div>

                    <div class="price-card">
                        <h3>Harga 1 Gram</h3>
                        <div class="card-value" id="harga1Gram">Loading...</div>
                    </div>
                </div>

                <div class="calculator-box">
                    <div class="tab-menu">
                        <button type="button" class="tab-btn active" id="tabGram">Gram</button>
                        <button type="button" class="tab-btn" id="tabHarga">Harga</button>
                    </div>

                    <div class="tab-content">
                        <div id="gramSection">
                            <input
                                type="number"
                                id="gramInput"
                                min="0"
                                step="any"
                                placeholder="Masukkan berat emas (gram)">

                            <div class="quick-buttons">
                                <button type="button" onclick="setGram(1)">1 gr</button>
                                <button type="button" onclick="setGram(3)">3 gr</button>
                                <button type="button" onclick="setGram(5)">5 gr</button>
                                <button type="button" onclick="setGram(10)">10 gr</button>
                            </div>
                        </div>

                        <div id="hargaSection" style="display:none;">
                            <input
                                type="number"
                                id="hargaInput"
                                min="0"
                                step="any"
                                placeholder="Masukkan nominal (Rp)">

                            <div class="quick-buttons">
                                <button type="button" onclick="setHarga(100000)">100rb</button>
                                <button type="button" onclick="setHarga(500000)">500rb</button>
                                <button type="button" onclick="setHarga(1000000)">1jt</button>
                                <button type="button" onclick="setHarga(10000000)">10jt</button>              
                            </div>
                        </div>
                    </div>
                </div>

                <div class="total-box">
                    <div class="total-title" id="totalTitle">Total Biaya Pembelian</div>
                    <div class="total-value" id="totalText">Rp 0</div>
                </div>

                <div class="action-buttons">
                    <button type="button" class="save-btn" id="saveBtn">Simpan Data</button>
                    <button type="button" class="reset-btn" id="resetBtn">Reset</button>
                </div>

            </div>
        </div>

    </main>
</div>

<script>
    /* =====================================================
       HELPER FORMATTER & TANGGAL
    ===================================================== */
    function formatRupiah(n) {
        return "Rp " + Math.round(Number(n) || 0).toLocaleString("id-ID");
    }

    function formatGramDisplay(n) {
        return Number((Number(n) || 0).toFixed(4)).toLocaleString("id-ID", {
            maximumFractionDigits: 4
        }) + " gram";
    }

    function getLocalDateString(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
    }

    function normalizeDateKey(raw) {
        if (!raw) return "";
        const str = String(raw).trim();

        const dmy = str.match(/^(\d{2})[-/](\d{2})[-/](\d{4})/);
        if (dmy) {
            return `${dmy[3]}-${dmy[2]}-${dmy[1]}`;
        }

        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
            return str;
        }

        const parsed = new Date(str);
        if (!isNaN(parsed.getTime())) {
            return getLocalDateString(parsed);
        }

        return "";
    }

    /* =====================================================
       HARGA EMAS, RIWAYAT TANGGAL & MODE MANUAL
    ===================================================== */
    let hargaPerGram = 0;
    let hargaDatabase = 0;
    let historyPrices = {};
    let manualMode = false;

    const hargaBeliEl = document.getElementById("hargaBeli");
    const harga1GramEl = document.getElementById("harga1Gram");
    const hargaStatusEl = document.getElementById("hargaStatus");
    const manualInput = document.getElementById("manualHarga");
    const editBtn = document.getElementById("editHargaBtn");
    const saveBtnHarga = document.getElementById("saveHargaBtn");
    const resetBtnHarga = document.getElementById("resetHargaBtn");

    function updateDisplayedPrices(harga001, statusText = "", statusColor = "#64748b") {
        hargaPerGram = harga001 * 100;
        hargaBeliEl.innerText = formatRupiah(harga001);
        harga1GramEl.innerText = formatRupiah(hargaPerGram);
        hargaStatusEl.textContent = statusText;
        hargaStatusEl.style.color = statusColor;
        recalculateTotal();
    }

    function applyPriceByDate(dateStr) {
        if (manualMode) return;

        const key = normalizeDateKey(dateStr);
        const todayStr = getLocalDateString();

        if (key && historyPrices[key]) {
            updateDisplayedPrices(
                historyPrices[key],
                key === todayStr
                    ? "Harga hari ini"
                    : `Harga riwayat (${tanggalText.textContent})`,
                "#16a34a"
            );
        } else if (hargaDatabase > 0) {
            const info = key === todayStr
                ? "Harga terbaru"
                : `Riwayat ${tanggalText.textContent} tidak ada, memakai harga terbaru`;
            const color = key === todayStr ? "#64748b" : "#d97706";
            updateDisplayedPrices(hargaDatabase, info, color);
        } else {
            hargaBeliEl.innerText = "Rp 0";
            harga1GramEl.innerText = "Rp 0";
            hargaStatusEl.textContent = "Data harga belum tersedia";
            hargaStatusEl.style.color = "#e53935";
        }
    }

    async function loadHargaDanHistory() {
        const [hargaRes, historyRes, asetRes] = await Promise.allSettled([
            fetch("/api/harga"),
            fetch("/api/history"),
            fetch("/api/data-aset")
        ]);

        if (asetRes.status === "fulfilled" && asetRes.value.ok) {
            try {
                const asetList = await asetRes.value.json();
                const items = Array.isArray(asetList) ? asetList : (asetList?.data || []);
                items.forEach(item => {
                    const key = normalizeDateKey(item.tanggal_aset);
                    if (key && item.harga_beli) {
                        historyPrices[key] = Number(item.harga_beli);
                    }
                });
            } catch (err) {
                console.error("Error parsing /api/data-aset:", err);
            }
        }

        if (historyRes.status === "fulfilled" && historyRes.value.ok) {
            try {
                const list = await historyRes.value.json();
                const items = Array.isArray(list) ? list : (list?.data || []);
                items.forEach(item => {
                    const key = normalizeDateKey(item.tanggal);
                    if (key && item.harga_beli) {
                        historyPrices[key] = Number(item.harga_beli);
                    }
                });
            } catch (err) {
                console.error("Error parsing /api/history:", err);
            }
        }

        if (hargaRes.status === "fulfilled" && hargaRes.value.ok) {
            try {
                const data = await hargaRes.value.json();
                if (data && data.harga_beli) {
                    hargaDatabase = Number(data.harga_beli);
                    const key = normalizeDateKey(data.tanggal);
                    if (key && !historyPrices[key]) {
                        historyPrices[key] = hargaDatabase;
                    }
                }
            } catch (err) {
                console.error("Error parsing /api/harga:", err);
            }
        }

        applyPriceByDate(tanggalInput.value);
    }

    editBtn.addEventListener("click", () => {
        if (hargaPerGram > 0) {
            manualInput.value = hargaPerGram / 100;
        }
        manualInput.style.display = "block";
        editBtn.style.display = "none";
        saveBtnHarga.style.display = "inline-block";
        resetBtnHarga.style.display = "inline-block";
        manualInput.focus();
    });

    saveBtnHarga.addEventListener("click", () => {
        const manual = Number(manualInput.value);

        if (manual <= 0) {
            alert("Masukkan harga yang valid");
            return;
        }

        manualMode = true;
        updateDisplayedPrices(manual, "Mode harga manual aktif", "#1f86ff");
    });

    resetBtnHarga.addEventListener("click", () => {
        manualMode = false;
        manualInput.value = "";
        manualInput.style.display = "none";
        saveBtnHarga.style.display = "none";
        resetBtnHarga.style.display = "none";
        editBtn.style.display = "inline-block";

        applyPriceByDate(tanggalInput.value);
    });

   /* =====================================================
       SIDEBAR & NAVIGASI
    ===================================================== */
    const toggleBtn = document.getElementById("toggleSidebar");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const main = document.querySelector(".main");
    let lastWindowWidth = window.innerWidth;

    toggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();

        if (window.innerWidth <= 768) {
            sidebar.classList.remove("hide");
            sidebar.classList.toggle("show");
            overlay.classList.toggle("show");
        } else {
            sidebar.classList.toggle("hide");
        }
    });

    window.addEventListener("resize", () => {
        if (window.innerWidth === lastWindowWidth) return;
        lastWindowWidth = window.innerWidth;

        if (window.innerWidth > 768) {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
            sidebar.classList.remove("hide");
        } else {
            sidebar.classList.remove("hide");
        }
    });

    overlay.addEventListener("click", () => {
        sidebar.classList.remove("show");
        overlay.classList.remove("show");
    });

    main.addEventListener("click", (e) => {
        if (sidebar.contains(e.target)) return;

        // Di HP, klik area konten bakal nutup sidebar
        if (window.innerWidth <= 768) {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
        }
    });

    function logout() {
        window.location.href = "login.html";
    }

    /* =====================================================
       TANGGAL PEMBELIAN (WAKTU LOKAL)
    ===================================================== */
    const tanggalInput = document.getElementById("tanggalPembelian");
    const tanggalText = document.getElementById("tanggalText");

    function formatTanggal(value) {
        if (!value) return "-";
        const [y, m, d] = value.split("-").map(Number);
        const date = new Date(y, m - 1, d);

        tanggalText.textContent = date.toLocaleDateString("id-ID", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });
    }

    function handleTanggalChange() {
        formatTanggal(tanggalInput.value);
        applyPriceByDate(tanggalInput.value);
    }

    tanggalInput.value = getLocalDateString();
    formatTanggal(tanggalInput.value);

    tanggalInput.addEventListener("change", handleTanggalChange);
    tanggalInput.addEventListener("input", handleTanggalChange);

    document.querySelector(".tanggal-display").addEventListener("click", () => {
        try {
            tanggalInput.showPicker();
        } catch (e) {}
    });

    /* =====================================================
       KALKULATOR TAB GRAM / HARGA
    ===================================================== */
    const tabGram = document.getElementById("tabGram");
    const tabHarga = document.getElementById("tabHarga");
    const gramSection = document.getElementById("gramSection");
    const hargaSection = document.getElementById("hargaSection");
    const gramInput = document.getElementById("gramInput");
    const hargaInput = document.getElementById("hargaInput");
    const totalTitle = document.getElementById("totalTitle");
    const totalText = document.getElementById("totalText");

    function isGramMode() {
        return tabGram.classList.contains("active");
    }

    function recalculateTotal() {
        if (isGramMode()) {
            totalTitle.textContent = "Total Biaya Pembelian";
            const gram = parseFloat(gramInput.value) || 0;
            const total = gram * hargaPerGram;
            totalText.textContent = formatRupiah(total);
        } else {
            totalTitle.textContent = "Estimasi Berat Emas";
            const harga = parseFloat(hargaInput.value) || 0;
            const gram = hargaPerGram > 0 ? harga / hargaPerGram : 0;
            totalText.textContent = formatGramDisplay(gram);
        }
    }

    tabGram.addEventListener("click", () => {
        tabGram.classList.add("active");
        tabHarga.classList.remove("active");
        gramSection.style.display = "block";
        hargaSection.style.display = "none";
        recalculateTotal();
    });

    tabHarga.addEventListener("click", () => {
        tabHarga.classList.add("active");
        tabGram.classList.remove("active");
        gramSection.style.display = "none";
        hargaSection.style.display = "block";
        recalculateTotal();
    });

    gramInput.addEventListener("input", recalculateTotal);
    hargaInput.addEventListener("input", recalculateTotal);

    function setGram(value) {
        gramInput.value = value;
        recalculateTotal();
    }

    function setHarga(value) {
        hargaInput.value = value;
        recalculateTotal();
    }

    /* =====================================================
       SIMPAN & RESET FORM
    ===================================================== */
    const saveBtn = document.getElementById("saveBtn");
    const resetBtn = document.getElementById("resetBtn");

    saveBtn.addEventListener("click", simpanData);
    resetBtn.addEventListener("click", resetForm);

    async function simpanData() {
        if (hargaPerGram <= 0) {
            alert("Harga emas belum tersedia. Muat ulang halaman atau gunakan Edit Manual.");
            return;
        }

        let biayaPembelian = 0;
        let aset = 0;

        if (isGramMode()) {
            aset = parseFloat(gramInput.value) || 0;
            biayaPembelian = Math.round(aset * hargaPerGram);
        } else {
            biayaPembelian = Math.round(parseFloat(hargaInput.value) || 0);
            aset = Number((biayaPembelian / hargaPerGram).toFixed(4));
        }

        if (biayaPembelian <= 0 || aset <= 0) {
            alert("Masukkan jumlah pembelian yang valid");
            return;
        }

        if (!tanggalInput.value) {
            alert("Pilih tanggal pembelian terlebih dahulu");
            return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = "Menyimpan...";

        try {
            const response = await fetch("/api/simpan-investasi", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    biaya_pembelian: biayaPembelian,
                    aset: aset,
                    tanggal_beli: tanggalInput.value
                })
            });

            const result = await response.json();

            if (response.ok) {
                alert("Data berhasil disimpan");
                resetForm();
            } else {
                console.error(result);
                alert(result.message || "Gagal menyimpan data");
            }
        } catch (err) {
            console.error(err);
            alert("Server error");
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "Simpan Data";
        }
    }

    function resetForm() {
        gramInput.value = "";
        hargaInput.value = "";
        recalculateTotal();
    }

    // Inisialisasi
    loadHargaDanHistory();
</script>

</body>
</html>
