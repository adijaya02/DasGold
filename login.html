<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GoldDash</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:radial-gradient(circle at top right, #0e4a8a 0%, #04264a 55%, #021830 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    overflow:hidden;
}

/* Dekorasi cahaya latar belakang */
body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    z-index:0;
    pointer-events:none;
}

body::before{
    width:340px;
    height:340px;
    background:rgba(31, 134, 255, 0.25);
    top:-80px;
    right:-60px;
}

body::after{
    width:300px;
    height:300px;
    background:rgba(245, 158, 11, 0.16);
    bottom:-80px;
    left:-60px;
}

.login-container{
    width:100%;
    max-width:420px;
    position:relative;
    z-index:1;
    animation:fadeSlideUp .5s ease;
}

@keyframes fadeSlideUp{
    from{
        opacity:0;
        transform:translateY(18px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.login-card{
    background:#ffffff;
    padding:42px 36px 34px;
    border-radius:24px;
    box-shadow:0 24px 60px rgba(2, 18, 40, 0.45);
    border:1px solid rgba(255, 255, 255, 0.12);
    position:relative;
    overflow:hidden;
}

/* Garis aksen emas-biru di bagian atas kartu */
.login-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:5px;
    background:linear-gradient(90deg, #f59e0b, #fbbf24, #1f86ff);
}

.brand{
    text-align:center;
    margin-bottom:30px;
}

.brand-icon{
    width:58px;
    height:58px;
    margin:0 auto 14px;
    border-radius:16px;
    background:linear-gradient(135deg, #fffbeb, #fef3c7);
    border:1px solid #fde68a;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 20px rgba(245, 158, 11, 0.18);
}

.brand h1{
    color:#04264a;
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.5px;
}

.brand h1 span{
    color:#d97706;
}

.brand p{
    color:#64748b;
    font-size:13.5px;
    margin-top:4px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:13.5px;
    font-weight:600;
    color:#1e293b;
}

.input-wrapper{
    position:relative;
    display:flex;
    align-items:center;
}

.input-icon{
    position:absolute;
    left:15px;
    color:#94a3b8;
    display:flex;
    align-items:center;
    pointer-events:none;
    transition:.25s;
}

.form-group input{
    width:100%;
    padding:13px 44px;
    border:1.5px solid #e2e8f0;
    border-radius:12px;
    outline:none;
    font-size:14px;
    color:#0f172a;
    background:#f8fafc;
    transition:all .25s ease;
}

.form-group input::placeholder{
    color:#94a3b8;
}

.form-group input:focus{
    background:#ffffff;
    border-color:#1f86ff;
    box-shadow:0 0 0 4px rgba(31, 134, 255, 0.14);
}

.input-wrapper:focus-within .input-icon{
    color:#1f86ff;
}

.toggle-password{
    position:absolute;
    right:14px;
    background:none;
    border:none;
    color:#94a3b8;
    cursor:pointer;
    display:flex;
    align-items:center;
    padding:4px;
    transition:.2s;
}

.toggle-password:hover{
    color:#04264a;
}

/* Alert Error */
.error-box{
    display:none;
    align-items:center;
    gap:8px;
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#dc2626;
    padding:11px 14px;
    border-radius:11px;
    font-size:13px;
    font-weight:500;
    margin-bottom:18px;
}

.error-box.show{
    display:flex;
    animation:shake .35s ease;
}

@keyframes shake{
    0%, 100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    50%{ transform:translateX(6px); }
    75%{ transform:translateX(-4px); }
}

.login-btn{
    width:100%;
    border:none;
    padding:14px;
    margin-top:6px;
    border-radius:12px;
    background:linear-gradient(135deg, #1f86ff, #0b5ed7);
    color:#ffffff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:0 10px 22px rgba(31, 134, 255, 0.28);
    transition:all .25s ease;
}

.login-btn:hover:not(:disabled){
    background:linear-gradient(135deg, #1877eb, #094db3);
    transform:translateY(-1px);
    box-shadow:0 12px 26px rgba(31, 134, 255, 0.36);
}

.login-btn:active:not(:disabled){
    transform:translateY(0);
}

.login-btn:disabled{
    opacity:.75;
    cursor:not-allowed;
}

.card-footer{
    margin-top:26px;
    padding-top:18px;
    border-top:1px solid #f1f5f9;
    text-align:center;
    font-size:12px;
    color:#94a3b8;
}

@media (max-width:480px){
    .login-card{
        padding:34px 22px 28px;
        border-radius:20px;
    }

    .brand h1{
        font-size:25px;
    }
}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-card">

        <div class="brand">
            <div class="brand-icon">
                <!-- Ikon Batangan Emas & Grafik -->
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
                    <path d="M4 17L7.5 11H16.5L20 17H4Z" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M8.5 11L10.5 7.5H13.5L15.5 11" fill="#FBBF24" stroke="#D97706" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M5 6L9 3.5L13 5.5L19 2" stroke="#1F86FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1><span>Gold</span>Dash</h1>
            <p>Masuk untuk memantau portofolio emas Anda</p>
        </div>

        <form id="loginForm" onsubmit="return loginUser(event)">

            <div class="form-group">
                <label for="userId">ID Pengguna</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input
                        type="text"
                        id="userId"
                        placeholder="Masukkan ID"
                        autocomplete="username"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Lihat Password">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="errorBox" class="error-box" role="alert">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="errorText">ID atau password salah!</span>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span>Masuk</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

        </form>

        <div class="card-footer">
            GoldDash • Sistem Monitoring Investasi Emas
        </div>

    </div>
</div>

<script>
    const userIdInput = document.getElementById("userId");
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");
    const errorBox = document.getElementById("errorBox");
    const errorText = document.getElementById("errorText");
    const loginBtn = document.getElementById("loginBtn");

    // Toggle lihat / sembunyikan password
    togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";

        eyeIcon.innerHTML = isPassword
            ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
               <line x1="1" y1="1" x2="23" y2="23"></line>`
            : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
               <circle cx="12" cy="12" r="3"></circle>`;
    });

    // Sembunyikan pesan error saat user mulai mengetik ulang
    [userIdInput, passwordInput].forEach(input => {
        input.addEventListener("input", () => {
            errorBox.classList.remove("show");
        });
    });

    function showError(message) {
        errorText.textContent = message;
        errorBox.classList.remove("show");
        void errorBox.offsetWidth; // trigger ulang animasi shake
        errorBox.classList.add("show");
    }

    function loginUser(event) {
        event.preventDefault();

        const id = userIdInput.value.trim();
        const password = passwordInput.value;

        if (id === "1905" && password === "2024") {
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<span>Memuat Dashboard...</span>`;
            window.location.href = "dashboard.html";
        } else {
            showError("ID atau password yang Anda masukkan salah!");
            passwordInput.focus();
        }

        return false;
    }
</script>

</body>
</html>
