<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Emas - GoldDash</title>
<script src="auth-guard.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    height:100vh;
    overflow:hidden;
    background:#eef2f7;
}

.dashboard{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    position:sticky;
    top:0;
    height:100vh;
    width:260px;
    background:#04264a;
    color:#fff;
    padding:25px 0;
    transition:all .3s ease;
    overflow:hidden;
    flex-shrink:0;
}

.sidebar.hide{
    width:0;
    min-width:0;
    padding:0;
}

.logo{
    font-size:28px;
    font-weight:700;
    text-align:center;
    margin-bottom:40px;
    white-space:nowrap;
}

.menu{
    list-style:none;
}

.menu li{
    transition:.3s;
}

.menu li:hover{
    background:#0b4f96;
}

.menu li.active{
    background:#1f86ff;
}

.menu li a{
    display:block;
    padding:16px 30px;
    color:#fff;
    text-decoration:none;
    white-space:nowrap;
}

/* MAIN */
.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    height:100vh;
    transition:all .3s ease;
}

/* TOPBAR */
.topbar{
    height:75px;
    flex-shrink:0;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.left-top{
    font-size:26px;
    cursor:pointer;
    user-select:none;
    background:none;
    border:none;
    color:#1b1b1b;
}

.right-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.logout-btn{
    background:#ff4d4d;
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.logout-btn:hover{
    background:#e60000;
}

/* TABLE CONTAINER */
.table-container{
    flex:1;
    min-height:0;
    margin:25px;
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.table-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    flex-wrap:wrap;
    gap:10px;
    flex-shrink:0;
}

.table-title{
    font-size:18px;
    font-weight:600;
    color:#1b1b1b;
}

/* NAVIGASI BULAN */
.month-nav{
    display:flex;
    align-items:center;
    gap:10px;
}

.month-btn{
    background:#1f86ff;
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.month-btn:hover:not(:disabled){
    background:#0b4f96;
}

.month-btn:disabled{
    background:#b8d4f8;
    cursor:not-allowed;
}

.desktop-text{
    display:inline;
}

.mobile-text{
    display:none;
}

/* MONTH PICKER & CALENDAR */
.month-label-wrapper{
    position:relative;
}

.month-label{
    background:#f3f6fa;
    padding:10px 18px;
    border-radius:10px;
    font-weight:600;
    color:#04264a;
    min-width:190px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.month-label:hover{
    background:#e8eef5;
}

.calendar-popup{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    width:330px;
    background:#ffffff;
    border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    border:1px solid #e1e6eb;
    padding:15px;
    z-index:1000;
    display:none;
}

.calendar-popup.show{
    display:block;
}

.calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.calendar-title{
    font-size:16px;
    font-weight:700;
    color:#04264a;
    text-transform:capitalize;
}

.calendar-nav-btn{
    width:32px;
    height:32px;
    border:none;
    border-radius:8px;
    background:#f1f4f8;
    color:#04264a;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.calendar-nav-btn:hover:not(:disabled){
    background:#1f86ff;
    color:#fff;
}

.calendar-nav-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.calendar-weekdays,
.calendar-days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
}

.calendar-weekdays{
    margin-bottom:5px;
}

.calendar-weekdays div{
    text-align:center;
    font-size:11px;
    font-weight:600;
    color:#6b7280;
    padding:6px 0;
}

.calendar-day{
    position:relative;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    font-size:13px;
    color:#1f2937;
    cursor:pointer;
    transition:.2s;
}

.calendar-day:hover{
    background:#eaf3ff;
}

.calendar-day.empty{
    cursor:default;
    pointer-events:none;
}

.calendar-day.has-data{
    font-weight:700;
    color:#04264a;
}

.calendar-day.has-data::after{
    content:"";
    position:absolute;
    bottom:4px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#1f86ff;
}

.calendar-day.selected{
    background:#1f86ff;
    color:#ffffff;
}

.calendar-day.selected::after{
    background:#ffffff;
}

.calendar-day.today{
    border:1px solid #1f86ff;
}

.calendar-footer{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.calendar-info{
    font-size:11px;
    color:#777;
}

.calendar-all-btn{
    border:none;
    background:#04264a;
    color:#fff;
    border-radius:7px;
    padding:7px 10px;
    font-size:11px;
    cursor:pointer;
    transition:.2s;
}

.calendar-all-btn:hover{
    background:#0b4f96;
}

/* TABEL */
.table-wrapper{
    flex:1;
    min-height:0;
    overflow:auto;
    border:1px solid #e5e7eb;
    border-radius:10px;
}

.history-table{
    width:100%;
    border-collapse:collapse;
}

.history-table thead th{
    position:sticky;
    top:0;
    background:#04264a;
    color:#ffffff;
    z-index:10;
    padding:14px;
    text-align:center;
    font-size:14px;
    font-weight:600;
    border-bottom:1px solid #0b4f96;
    white-space:nowrap;
}

.history-table tbody td{
    padding:14px;
    background:#ffffff;
    border-bottom:1px solid #e5e5e5;
    text-align:center;
    font-size:14px;
    white-space:nowrap;
}

.history-table tbody tr:last-child td{
    border-bottom:none;
}

.history-table tbody tr:hover td{
    background:#f7f9fc;
}

.status-cell{
    text-align:center;
    padding:30px !important;
    color:#777;
}

.status-cell.error{
    color:#d32f2f;
}

.profit{
    color:#16a34a;
    font-weight:600;
}

.loss{
    color:#e53935;
    font-weight:600;
}

#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

#overlay.show{
    opacity:1;
    visibility:visible;
}

/* =========================
   MOBILE
========================= */
@media (max-width:768px){
    .dashboard{
        flex-direction:column;
    }

    .sidebar{
        position:fixed;
        top:0;
        left:0;
        width:220px;
        height:100vh;
        z-index:1001;
        transform:translateX(-100%);
        transition:.3s;
        box-shadow:0 0 25px rgba(0,0,0,.25);
    }

    .sidebar.show{
        transform:translateX(0);
    }

    .sidebar.hide{
        width:220px;
        transform:translateX(-100%);
    }

    .logo{
        font-size:24px;
        margin-bottom:25px;
    }

    .menu li a{
        padding:14px 20px;
        font-size:15px;
    }

    .main{
        width:100%;
    }

    .topbar{
        height:65px;
        padding:0 15px;
    }

    .left-top{
        font-size:24px;
    }

    .table-container{
        margin:12px;
        padding:15px;
    }

    .month-nav{
        width:100%;
        display:flex;
        align-items:center;
        gap:10px;
    }

    .month-btn{
        flex:0 0 auto;
        width:56px;
        min-width:56px;
        height:42px;
        padding:0;
        border-radius:12px;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .desktop-text{
        display:none;
    }

    .mobile-text{
        display:inline;
        font-size:20px;
        font-weight:700;
        line-height:1;
    }

    .month-label-wrapper{
        flex:1;
        min-width:0;
    }

    .month-label{
        width:100%;
        min-width:0;
        padding:10px 14px;
        font-size:14px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .calendar-popup{
        position:fixed;
        top:125px;
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:calc(100vw - 30px);
        max-width:360px;
        max-height:calc(100vh - 140px);
        overflow-y:auto;
        padding:14px;
    }

    .calendar-day{
        height:40px;
        font-size:13px;
    }

    .calendar-title{
        font-size:15px;
    }

    .history-table thead th,
    .history-table tbody td{
        padding:10px;
        font-size:13px;
    }
}

/* =========================
   EXTRA SMALL DEVICE
========================= */
@media (max-width:480px){
    .logo{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div id="overlay"></div>

<div class="dashboard">

    <aside class="sidebar" id="sidebar">
        <div class="logo">GoldDash</div>

        <ul class="menu">
            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>
            <li>
                <a href="harga-emas.html">Harga Emas</a>
            </li>
            <li class="active">
                <a href="data-emas.html">Data Emas</a>
            </li>
            <li>
                <a href="investasi.html">Investasi</a>
            </li>            
        </ul>
    </aside>

    <main class="main">
        <div class="topbar">
            <button type="button" class="left-top" id="toggleSidebar" aria-label="Toggle Menu">
                ☰
            </button>

            <div class="right-top">
                <button type="button" class="logout-btn" onclick="logout()">
                    Logout
                </button>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <div class="table-title">History Aset Emas</div>

                <div class="month-nav">
                    <button id="prevMonth" class="month-btn" type="button" title="Bulan Sebelumnya">
                        <span class="desktop-text">← Bulan Sebelumnya</span>
                        <span class="mobile-text">←</span>
                    </button>

                    <div class="month-label-wrapper">
                        <div id="monthLabel" class="month-label" title="Klik untuk pilih tanggal"></div>

                        <!-- CALENDAR -->
                        <div id="calendarPopup" class="calendar-popup">
                            <div class="calendar-header">
                                <button type="button" id="calendarPrev" class="calendar-nav-btn" aria-label="Bulan Sebelumnya">
                                    ←
                                </button>

                                <div id="calendarTitle" class="calendar-title"></div>

                                <button type="button" id="calendarNext" class="calendar-nav-btn" aria-label="Bulan Berikutnya">
                                    →
                                </button>
                            </div>

                            <div class="calendar-weekdays">
                                <div>Sen</div>
                                <div>Sel</div>
                                <div>Rab</div>
                                <div>Kam</div>
                                <div>Jum</div>
                                <div>Sab</div>
                                <div>Min</div>
                            </div>

                            <div id="calendarDays" class="calendar-days"></div>

                            <div class="calendar-footer">
                                <div id="calendarInfo" class="calendar-info">
                                    ● Memiliki data
                                </div>

                                <button type="button" id="showAllMonth" class="calendar-all-btn">
                                    Semua tanggal
                                </button>
                            </div>
                        </div>
                    </div>

                    <button id="nextMonth" class="month-btn" type="button" title="Bulan Berikutnya">
                        <span class="desktop-text">Bulan Berikutnya →</span>
                        <span class="mobile-text">→</span>
                    </button>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Hari / Tanggal</th>
                            <th>Harga Beli</th>
                            <th>Biaya Pembelian</th>
                            <th>Total Modal</th>
                            <th>Aset</th>
                            <th>Total Aset</th>
                            <th>Harga Jual</th>
                            <th>Jumlah Uang di Aplikasi</th>
                            <th>Untung/Rugi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="10" class="status-cell">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</div>

<script>
   /* =====================================================
       SIDEBAR & NAVIGASI
    ===================================================== */
    const toggleBtn = document.getElementById("toggleSidebar");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const main = document.querySelector(".main");
    let lastWindowWidth = window.innerWidth;

    toggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();

        if (window.innerWidth <= 768) {
            sidebar.classList.remove("hide");
            sidebar.classList.toggle("show");
            overlay.classList.toggle("show");
        } else {
            sidebar.classList.toggle("hide");
        }
    });

    window.addEventListener("resize", () => {
        if (window.innerWidth === lastWindowWidth) return;
        lastWindowWidth = window.innerWidth;

        if (window.innerWidth > 768) {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
            sidebar.classList.remove("hide");
        } else {
            sidebar.classList.remove("hide");
        }
    });

    overlay.addEventListener("click", () => {
        sidebar.classList.remove("show");
        overlay.classList.remove("show");
    });

    main.addEventListener("click", (e) => {
        if (sidebar.contains(e.target)) return;

        // Di HP, klik area konten bakal nutup sidebar
        if (window.innerWidth <= 768) {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
        }
    });

    /* =====================================================
       LOGOUT
    ===================================================== */
    function logout() {
        window.location.href = "login.html";
    }

    /* =====================================================
       STATE & ELEMENTS
    ===================================================== */
    let allData = [];
    let filteredData = [];
    let currentOffset = 0;
    let selectedDateKey = null;

    const prevMonthBtn = document.getElementById("prevMonth");
    const nextMonthBtn = document.getElementById("nextMonth");
    const monthLabel = document.getElementById("monthLabel");
    const calendarPopup = document.getElementById("calendarPopup");
    const calendarTitle = document.getElementById("calendarTitle");
    const calendarDays = document.getElementById("calendarDays");
    const calendarPrev = document.getElementById("calendarPrev");
    const calendarNext = document.getElementById("calendarNext");
    const showAllMonth = document.getElementById("showAllMonth");

    /* =====================================================
       HELPERS
    ===================================================== */
    function formatRupiah(value) {
        const num = Math.round(Number(value) || 0);
        if (num < 0) {
            return "-Rp " + Math.abs(num).toLocaleString("id-ID");
        }
        return "Rp " + num.toLocaleString("id-ID");
    }

    function formatGram(value) {
        return (Number(value) || 0).toFixed(4).replace(".", ",");
    }

    function formatTanggal(value) {
        return new Date(value).toLocaleDateString("id-ID", {
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric"
        });
    }

    function getDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    function getMonthRange() {
        const today = new Date();
        const start = new Date(today.getFullYear(), today.getMonth() - currentOffset, 1, 0, 0, 0, 0);
        const end = new Date(today.getFullYear(), today.getMonth() - currentOffset + 1, 0, 23, 59, 59, 999);
        return { start, end };
    }

    function getSelectedMonthDate() {
        const today = new Date();
        return new Date(today.getFullYear(), today.getMonth() - currentOffset, 1);
    }

    /* =====================================================
       UPDATE LABEL & TOMBOL NAVIGASI
    ===================================================== */
    function updateMonthLabel() {
        const selectedMonth = getSelectedMonthDate();
        const isCurrentMonth = currentOffset <= 0;

        nextMonthBtn.disabled = isCurrentMonth;
        calendarNext.disabled = isCurrentMonth;

        if (selectedDateKey) {
            const [year, month, day] = selectedDateKey.split("-").map(Number);
            const selectedDate = new Date(year, month - 1, day);

            monthLabel.textContent = selectedDate.toLocaleDateString("id-ID", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        } else {
            const label = selectedMonth.toLocaleDateString("id-ID", {
                month: "long",
                year: "numeric"
            });
            monthLabel.textContent = `Data ${label}`;
        }
    }

    /* =====================================================
       FILTER & RENDER TABLE
    ===================================================== */
    function filterDataByMonth() {
        const { start, end } = getMonthRange();

        filteredData = allData.filter(item => {
            const tanggal = new Date(item.tanggal_aset);
            if (tanggal < start || tanggal > end) return false;
            if (selectedDateKey) {
                return getDateKey(tanggal) === selectedDateKey;
            }
            return true;
        });

        filteredData.sort((a, b) => new Date(b.tanggal_aset) - new Date(a.tanggal_aset));
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById("tableBody");

        if (filteredData.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="10" class="status-cell">Tidak ada data</td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = filteredData.map((item, index) => {
            const profitLoss = Number(item.untung_rugi || 0);
            const className = profitLoss >= 0 ? "profit" : "loss";

            return `
                <tr>
                    <td>${index + 1}</td>
                    <td>${formatTanggal(item.tanggal_aset)}</td>
                    <td>${formatRupiah(item.harga_beli)}</td>
                    <td>${formatRupiah(item.biaya_pembelian)}</td>
                    <td>${formatRupiah(item.total_modal)}</td>
                    <td>${formatGram(item.aset)} gr</td>
                    <td>${formatGram(item.total_aset)} gr</td>
                    <td>${formatRupiah(item.harga_jual)}</td>
                    <td>${formatRupiah(item.jumlah_uang_aplikasi)}</td>
                    <td class="${className}">${formatRupiah(item.untung_rugi)}</td>
                </tr>
            `;
        }).join("");
    }

    /* =====================================================
       NAVIGASI BULAN
    ===================================================== */
    function changeMonth(delta) {
        if (delta < 0 && currentOffset <= 0) return;
        currentOffset += delta;
        selectedDateKey = null;
        updateMonthLabel();
        filterDataByMonth();
        renderCalendar();
    }

    prevMonthBtn.addEventListener("click", () => changeMonth(1));
    nextMonthBtn.addEventListener("click", () => changeMonth(-1));
    calendarPrev.addEventListener("click", () => changeMonth(1));
    calendarNext.addEventListener("click", () => changeMonth(-1));

    /* =====================================================
       KALENDER POPUP
    ===================================================== */
    monthLabel.addEventListener("click", (e) => {
        e.stopPropagation();
        calendarPopup.classList.toggle("show");
        renderCalendar();
    });

    calendarPopup.addEventListener("click", (e) => {
        e.stopPropagation();
    });

    document.addEventListener("click", () => {
        calendarPopup.classList.remove("show");
    });

    showAllMonth.addEventListener("click", () => {
        selectedDateKey = null;
        updateMonthLabel();
        filterDataByMonth();
        renderCalendar();
        calendarPopup.classList.remove("show");
    });

    function renderCalendar() {
        const selectedMonth = getSelectedMonthDate();
        const year = selectedMonth.getFullYear();
        const month = selectedMonth.getMonth();

        calendarTitle.textContent = selectedMonth.toLocaleDateString("id-ID", {
            month: "long",
            year: "numeric"
        });

        const firstDay = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Senin = 0, Selasa = 1, ..., Minggu = 6
        let startDay = firstDay.getDay() - 1;
        if (startDay < 0) startDay = 6;

        const datesWithData = new Set();
        allData.forEach(item => {
            const date = new Date(item.tanggal_aset);
            if (date.getFullYear() === year && date.getMonth() === month) {
                datesWithData.add(getDateKey(date));
            }
        });

        const todayKey = getDateKey(new Date());
        let html = "";

        for (let i = 0; i < startDay; i++) {
            html += `<div class="calendar-day empty"></div>`;
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month, day);
            const dateKey = getDateKey(date);
            const hasData = datesWithData.has(dateKey);
            const isToday = dateKey === todayKey;
            const isSelected = dateKey === selectedDateKey;

            let classes = "calendar-day";
            if (hasData) classes += " has-data";
            if (isToday) classes += " today";
            if (isSelected) classes += " selected";

            html += `<div class="${classes}" data-date="${dateKey}">${day}</div>`;
        }

        calendarDays.innerHTML = html;

        calendarDays.querySelectorAll(".calendar-day[data-date]").forEach(dayElement => {
            dayElement.addEventListener("click", () => {
                selectedDateKey = dayElement.dataset.date;
                updateMonthLabel();
                filterDataByMonth();
                renderCalendar();
                calendarPopup.classList.remove("show");
            });
        });
    }

    /* =====================================================
       LOAD DATA DARI API
    ===================================================== */
    async function loadData() {
        updateMonthLabel();

        try {
            const response = await fetch("/api/data-aset");
            if (!response.ok) {
                throw new Error(`HTTP Error ${response.status}`);
            }

            const result = await response.json();
            allData = Array.isArray(result) ? result : [];

            allData.sort((a, b) => new Date(b.tanggal_aset) - new Date(a.tanggal_aset));

            filterDataByMonth();
            renderCalendar();
        } catch (error) {
            console.error("Gagal load data aset:", error);
            document.getElementById("tableBody").innerHTML = `
                <tr>
                    <td colspan="10" class="status-cell error">
                        Gagal mengambil data aset
                    </td>
                </tr>
            `;
        }
    }

    loadData();
</script>
</body>
</html>
