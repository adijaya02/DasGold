<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Emas</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

	*{
		margin:0;
		padding:0;
		box-sizing:border-box;
		font-family:'Poppins',sans-serif;
	}

	body{
		background:#eef2f7;
	}

	.dashboard{
		display:flex;
		min-height:100vh;
	}

	/* SIDEBAR */

	.sidebar{
        width:260px;
        background:#04264a;
        color:#fff;
        padding:25px 0;
        overflow:hidden;
        transition:all .3s ease;
        flex-shrink:0;
    }

	.sidebar.hide{
        width:0;
        min-width:0;
        padding:0;
    }

	.logo{
		font-size:28px;
		font-weight:700;
		text-align:center;
		margin-bottom:40px;
		white-space:nowrap;
	}

	.menu{
		list-style:none;
	}

	.menu li{
		transition:.3s;
	}

	.menu li:hover{
		background:#0b4f96;
	}

	.menu li.active{
		background:#1f86ff;
	}

	.menu li a{
		display:block;
		padding:16px 30px;
		color:#fff;
		text-decoration:none;
	}

	/* MAIN */

	.main{
        flex:1;
        min-width:0;
        transition:.3s;
    }

	/* TOPBAR */

	.topbar{
		height:75px;
		background:#fff;
		display:flex;
		align-items:center;
		justify-content:space-between;
		padding:0 30px;
		box-shadow:0 2px 10px rgba(0,0,0,.05);
	}

	.left-top{
		font-size:26px;
		cursor:pointer;
		user-select:none;
	}

	.right-top{
		display:flex;
		align-items:center;
		gap:15px;
	}

	.logout-btn{
		background:#ff4d4d;
		color:#fff;
		border:none;
		padding:10px 16px;
		border-radius:10px;
		cursor:pointer;
		font-weight:600;
		transition:.3s;
	}

	.logout-btn:hover{
		background:#e60000;
	}

	/* HISTORY TABLE */

	.table-container{
		margin-top:25px;
		background:#fff;
		border-radius:14px;
		padding:20px;
		box-shadow:0 4px 15px rgba(0,0,0,.05);
		overflow-x:auto;
	}

	.table-title{
		font-size:18px;
		font-weight:600;
		margin-bottom:15px;
		color:#1b1b1b;
	}

	.history-table{
		width:100%;
		border-collapse:collapse;
	}

	.history-table td{
		padding:14px;
		border-bottom:1px solid #e5e5e5;
		font-size:14px;
	}

	.history-table tr:hover{
		background:#f7f9fc;
	}

    .loss{
    color:#e53935;
    font-weight:600;
	}

	.profit{
    color:#16a34a;
    font-weight:600;
	}

/* =========================
   TABLET
========================= */
@media (max-width: 1200px){

    .stats{
        grid-template-columns: repeat(2,1fr);
    }

    .chart-area{
        grid-template-columns: 1fr;
    }

}

/* =========================
   MOBILE
========================= */
@media (max-width:768px){

    /* Dashboard */
    .dashboard{
        flex-direction:column;
    }

    /* Sidebar */
    .sidebar{
        position:fixed;
        top:0;
        left:0;
        width:220px;
        height:100vh;
        z-index:1001;
        transform:translateX(-100%);
        transition:.3s;
        box-shadow:0 0 25px rgba(0,0,0,.25);
    }

    .sidebar.show{
        transform:translateX(0);
    }

    .sidebar.hide{
        width:220px;
        transform:translateX(-100%);
    }

    .logo{
        font-size:24px;
        margin-bottom:25px;
    }

    .menu li a{
        padding:14px 20px;
        font-size:15px;
    }

    /* Main */
    .main{
        width:100%;
    }

    .topbar{
        height:65px;
        padding:0 15px;
    }

    .left-top{
        font-size:24px;
    }

    .content{
        padding:12px;
    }

    /* Cards */
    .stats{
        grid-template-columns:1fr;
        gap:12px;
    }

    .card{
        padding:16px;
    }

    .card-title{
        font-size:13px;
    }

    .card-value{
        font-size:24px;
    }

    .card-sub{
        font-size:12px;
    }

    /* Panel */
    .panel{
        padding:15px;
    }

    .panel-header{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }

    /* Filter */
    .tabs{
        width:100%;
    }

    .filter{
        width:100%;
        flex-wrap:wrap;
    }

    .filter button{
        flex:1;
        min-width:90px;
    }

    /* Chart */
    .chart-area{
        grid-template-columns:1fr;
        gap:15px;
    }

    .chart-box{
        height:220px;
        font-size:15px;
    }

    /* Ranking */
    .ranking{
        padding:15px;
    }

    .ranking h3{
        font-size:16px;
    }

    .rank-item{
        font-size:14px;
    }

    .month-nav{
        width:100%;
        display:flex;
        align-items:center;
        gap:10px;
    }

    .month-btn{
        flex:0 0 auto;
        width:60px;
        min-width:60px;
        height:44px;
        padding:0;
        border-radius:12px;
        font-size:18px;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .month-btn .desktop-text{
        display:none !important;
    }

    .month-btn .mobile-text{
        display:inline !important;
        font-size:20px;
        font-weight:700;
        line-height:1;
    }

    #monthLabel{
        flex:1;
        min-width:0;
        padding:10px 14px !important;
        font-size:14px !important;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .desktop-text{
        display:none;
    }

    .mobile-text{
        display:inline;
    }

    .calendar-popup{
        position:fixed;
        top:125px;
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:calc(100vw - 30px);
        max-width:360px;
        padding:14px;
    }

    .calendar-day{
        height:40px;
        font-size:13px;
    }

    .calendar-title{
        font-size:15px;
    }

    /* Table */
    .history-table th,
    .history-table td{
        padding:10px;
        font-size:13px;
    }

    /* Mobile text */
    .desktop-text{
        display:none;
    }

    .mobile-text{
        display:inline;
        font-size:20px;
        font-weight:700;
        line-height:1;
    }
}

/* =========================
   EXTRA SMALL DEVICE
========================= */
@media (max-width: 480px){

    }

}

    /* TANGGAL */

    .calendar-day{

        align-items:center;
        justify-content:center;
        border-radius:8px;
        font-size:13px;
        color:#1f2937;
        cursor:pointer;
        transition:.2s;
    }

    /* scroll */

</style>

<script>
	/* =====================================================
       SIDEBAR
    ===================================================== */

    const toggleBtn =
        document.getElementById("toggleSidebar");

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    if (window.innerWidth > 768) {

        sidebar.classList.add("hide");

    }


    toggleBtn.addEventListener("click", (e) => {

        e.stopPropagation();

        if (window.innerWidth <= 768) {

            sidebar.classList.remove("hide");

            sidebar.classList.toggle("show");

            overlay.classList.toggle("show");

        } else {

            sidebar.classList.toggle("hide");

        }

    });


    window.addEventListener("resize", () => {

        if (window.innerWidth > 768) {

            sidebar.classList.remove("show");

            overlay.classList.remove("show");

            sidebar.classList.add("hide");

        } else {

            sidebar.classList.remove("hide");

        }

    });


    overlay.addEventListener("click", () => {

        sidebar.classList.remove("show");

        overlay.classList.remove("show");

    });


    const main =
        document.querySelector(".main");


    main.addEventListener("click", (e) => {

        if (sidebar.contains(e.target)) return;

        if (window.innerWidth > 768) {

            sidebar.classList.add("hide");

        } else {

            sidebar.classList.remove("show");

            overlay.classList.remove("show");

        }

    });


    /* =====================================================
       LOGOUT
    ===================================================== */

    function logout() {

        window.location.href = "login.html";

    }


    /* =====================================================
       DATA
    ===================================================== */

    let allData = [];

    let filteredData = [];

    let currentOffset = 0;

    /*
        null = semua tanggal dalam bulan
        "YYYY-MM-DD" = tanggal tertentu
    */

    let selectedDateKey = null;


    /* =====================================================
       ELEMENT
    ===================================================== */

    const prevMonthBtn =
        document.getElementById("prevMonth");

    const nextMonthBtn =
        document.getElementById("nextMonth");

    const monthLabel =
        document.getElementById("monthLabel");

    const calendarPopup =
        document.getElementById("calendarPopup");

    const calendarTitle =
        document.getElementById("calendarTitle");

    const calendarDays =
        document.getElementById("calendarDays");

    const calendarPrev =
        document.getElementById("calendarPrev");

    const calendarNext =
        document.getElementById("calendarNext");

    const showAllMonth =
        document.getElementById("showAllMonth");


    /* =====================================================
       FORMAT RUPIAH
    ===================================================== */

    function formatRupiah(value) {

        return Number(
            Math.round(value || 0)
        ).toLocaleString("id-ID");

    }


    /* =====================================================
       FORMAT GRAM
    ===================================================== */

    function formatGram(value) {

        return Number(value || 0)
            .toFixed(4)
            .replace(".", ",");

    }


    /* =====================================================
       FORMAT TANGGAL
    ===================================================== */

    function formatTanggal(value) {

        return new Date(value).toLocaleDateString(
            "id-ID",
            {
                weekday: "long",
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        );

    }


    /* =====================================================
       FORMAT DATE KEY
       Contoh: 2026-09-15
    ===================================================== */

    function getDateKey(date) {

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                date.getDate()
            ).padStart(2, "0");

        return `${year}-${month}-${day}`;

    }


    /* =====================================================
       RANGE BULAN
    ===================================================== */

    function getMonthRange() {

        const today =
            new Date();


        const start =
            new Date(
                today.getFullYear(),
                today.getMonth() - currentOffset,
                1
            );


        const end =
            new Date(
                today.getFullYear(),
                today.getMonth() - currentOffset + 1,
                0,
                23,
                59,
                59,
                999
            );


        return {
            start,
            end
        };

    }


    /* =====================================================
       TANGGAL BULAN YANG SEDANG DIPILIH
    ===================================================== */

    function getSelectedMonthDate() {

        const today =
            new Date();


        return new Date(
            today.getFullYear(),
            today.getMonth() - currentOffset,
            1
        );

    }


    /* =====================================================
       UPDATE LABEL BULAN
    ===================================================== */

    function updateMonthLabel() {

        const selectedMonth =
            getSelectedMonthDate();


        const label =
            selectedMonth.toLocaleDateString(
                "id-ID",
                {
                    month: "long",
                    year: "numeric"
                }
            );


        if (selectedDateKey) {

            const [
                year,
                month,
                day
            ] =
                selectedDateKey
                    .split("-")
                    .map(Number);


            const selectedDate =
                new Date(
                    year,
                    month - 1,
                    day
                );


            monthLabel.textContent =
                selectedDate.toLocaleDateString(
                    "id-ID",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );

        } else {

            monthLabel.textContent =
                `Data ${label}`;

        }

    }


    /* =====================================================
       FILTER DATA
    ===================================================== */

    function filterDataByMonth() {

        const {
            start,
            end
        } =
            getMonthRange();


        filteredData =
            allData.filter(item => {

                const tanggal =
                    new Date(
                        item.tanggal_aset
                    );


                if (
                    tanggal < start ||
                    tanggal > end
                ) {

                    return false;

                }


                /*
                    Jika tanggal tertentu dipilih,
                    tampilkan hanya tanggal tersebut.
                */

                if (selectedDateKey) {

                    return (
                        getDateKey(tanggal) ===
                        selectedDateKey
                    );

                }


                return true;

            });


        /*
            Terbaru terlebih dahulu
        */

        filteredData.sort(
            (a, b) =>
                new Date(b.tanggal_aset) -
                new Date(a.tanggal_aset)
        );


        renderTable();

    }


    /* =====================================================
       RENDER TABLE
    ===================================================== */

    function renderTable() {

        const tbody =
            document.getElementById(
                "tableBody"
            );


        if (
            filteredData.length === 0
        ) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        style="
                            text-align:center;
                            padding:30px;
                            color:#777;
                        "
                    >
                        Tidak ada data
                    </td>

                </tr>

            `;

            return;

        }


        tbody.innerHTML =
            filteredData
                .map(
                    (item, index) => {

                        const profitLoss =
                            Number(
                                item.untung_rugi ||
                                0
                            );


                        const className =
                            profitLoss >= 0
                                ? "profit"
                                : "loss";


                        return `

                            <tr>

                                <td>
                                    ${index + 1}
                                </td>


                                <td>
                                    ${formatTanggal(
                                        item.tanggal_aset
                                    )}
                                </td>


                                <td>
                                    Rp ${formatRupiah(
                                        item.harga_beli
                                    )}
                                </td>


                                <td>
                                    Rp ${formatRupiah(
                                        item.biaya_pembelian
                                    )}
                                </td>


                                <td>
                                    Rp ${formatRupiah(
                                        item.total_modal
                                    )}
                                </td>


                                <td>
                                    ${formatGram(
                                        item.aset
                                    )}
                                </td>


                                <td>
                                    ${formatGram(
                                        item.total_aset
                                    )}
                                </td>


                                <td>
                                    Rp ${formatRupiah(
                                        item.harga_jual
                                    )}
                                </td>


                                <td>
                                    Rp ${formatRupiah(
                                        item.jumlah_uang_aplikasi
                                    )}
                                </td>


                                <td class="${className}">
                                    Rp ${formatRupiah(
                                        item.untung_rugi
                                    )}
                                </td>

                            </tr>

                        `;

                    }
                )
                .join("");

    }


    /* =====================================================
       BULAN SEBELUMNYA
    ===================================================== */

    prevMonthBtn.addEventListener(
        "click",
        () => {

            currentOffset++;

            selectedDateKey = null;

            updateMonthLabel();

            filterDataByMonth();

            renderCalendar();

        }
    );


    /* =====================================================
       BULAN BERIKUTNYA
    ===================================================== */

    nextMonthBtn.addEventListener(
        "click",
        () => {

            /*
                Tidak boleh masuk bulan masa depan
            */

            if (
                currentOffset <= 0
            ) {

                return;

            }


            currentOffset--;

            selectedDateKey = null;

            updateMonthLabel();

            filterDataByMonth();

            renderCalendar();

        }
    );


    /* =====================================================
       BUKA / TUTUP KALENDER
    ===================================================== */

    monthLabel.addEventListener(
        "click",
        (e) => {

            e.stopPropagation();

            calendarPopup.classList.toggle(
                "show"
            );

            renderCalendar();

        }
    );


    /*
        Jangan tutup kalender jika klik
        di dalam kalender.
    */

    calendarPopup.addEventListener(
        "click",
        (e) => {

            e.stopPropagation();

        }
    );


    /*
        Klik di luar kalender
        = tutup kalender
    */

    document.addEventListener(
        "click",
        () => {

            calendarPopup.classList.remove(
                "show"
            );

        }
    );


    /* =====================================================
       RENDER CALENDAR
    ===================================================== */

    function renderCalendar() {

        const selectedMonth =
            getSelectedMonthDate();


        const year =
            selectedMonth.getFullYear();


        const month =
            selectedMonth.getMonth();


        /*
            Nama bulan
        */

        calendarTitle.textContent =
            selectedMonth.toLocaleDateString(
                "id-ID",
                {
                    month: "long",
                    year: "numeric"
                }
            );


        /*
            Hari pertama bulan
        */

        const firstDay =
            new Date(
                year,
                month,
                1
            );


        /*
            Jumlah hari
        */

        const daysInMonth =
            new Date(
                year,
                month + 1,
                0
            ).getDate();


        /*
            Senin = 0
            Selasa = 1
            ...
            Minggu = 6
        */

        let startDay =
            firstDay.getDay() - 1;


        if (startDay < 0) {

            startDay = 6;

        }


        /*
            Buat daftar tanggal
            yang memiliki data
        */

        const datesWithData =
            new Set();


        allData.forEach(item => {

            const date =
                new Date(
                    item.tanggal_aset
                );


            if (
                date.getFullYear() === year &&
                date.getMonth() === month
            ) {

                datesWithData.add(
                    getDateKey(date)
                );

            }

        });


        /*
            Hari ini
        */

        const today =
            new Date();


        const todayKey =
            getDateKey(today);


        /*
            Mulai isi kalender
        */

        let html = "";


        /*
            Kotak kosong sebelum tanggal 1
        */

        for (
            let i = 0;
            i < startDay;
            i++
        ) {

            html += `
                <div
                    class="calendar-day empty"
                ></div>
            `;

        }


        /*
            Tanggal 1 sampai akhir bulan
        */

        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const date =
                new Date(
                    year,
                    month,
                    day
                );


            const dateKey =
                getDateKey(date);


            const hasData =
                datesWithData.has(
                    dateKey
                );


            const isToday =
                dateKey === todayKey;


            const isSelected =
                dateKey === selectedDateKey;


            let classes =
                "calendar-day";


            if (hasData) {

                classes +=
                    " has-data";

            }


            if (isToday) {

                classes +=
                    " today";

            }


            if (isSelected) {

                classes +=
                    " selected";

            }


            html += `

                <div
                    class="${classes}"
                    data-date="${dateKey}"
                >
                    ${day}
                </div>

            `;

        }


        calendarDays.innerHTML =
            html;


        /*
            Event klik tanggal
        */

        const dayElements =
            calendarDays.querySelectorAll(
                ".calendar-day[data-date]"
            );


        dayElements.forEach(
            dayElement => {

                dayElement.addEventListener(
                    "click",
                    () => {

                        const dateKey =
                            dayElement.dataset.date;


                        /*
                            Pastikan tanggal
                            berada di bulan yang dipilih
                        */

                        selectedDateKey =
                            dateKey;


                        updateMonthLabel();

                        filterDataByMonth();

                        renderCalendar();

                        /*
                            Tutup kalender
                        */

                        calendarPopup.classList.remove(
                            "show"
                        );

                    }
                );

            }
        );

    }


    /* =====================================================
       BULAN SEBELUMNYA DI KALENDER
    ===================================================== */

    calendarPrev.addEventListener(
        "click",
        () => {

            currentOffset++;

            selectedDateKey = null;

            updateMonthLabel();

            filterDataByMonth();

            renderCalendar();

        }
    );


    /* =====================================================
       BULAN BERIKUTNYA DI KALENDER
    ===================================================== */

    calendarNext.addEventListener(
        "click",
        () => {

            if (
                currentOffset <= 0
            ) {

                return;

            }


            currentOffset--;

            selectedDateKey = null;

            updateMonthLabel();

            filterDataByMonth();

            renderCalendar();

        }
    );


    /* =====================================================
       TAMPILKAN SEMUA DATA BULAN
    ===================================================== */

    showAllMonth.addEventListener(
        "click",
        () => {

            selectedDateKey = null;

            updateMonthLabel();

            filterDataByMonth();

            renderCalendar();

        }
    );


    /* =====================================================
       LOAD DATA DARI API
    ===================================================== */

    async function loadData() {

        try {

            const response =
                await fetch(
                    "/api/data-aset"
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP Error ${response.status}`
                );

            }


            const result =
                await response.json();


            if (
                Array.isArray(result)
            ) {

                allData = result;

            } else {

                allData = [];

            }


            /*
                Urutkan terbaru
            */

            allData.sort(
                (a, b) =>
                    new Date(
                        b.tanggal_aset
                    ) -
                    new Date(
                        a.tanggal_aset
                    )
            );


            /*
                Tampilkan bulan berjalan
            */

            updateMonthLabel();

            filterDataByMonth();

            renderCalendar();

        } catch (error) {

            console.error(
                "Gagal load data aset:",
                error
            );


            document.getElementById(
                "tableBody"
            ).innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        style="
                            text-align:center;
                            padding:30px;
                            color:#d32f2f;
                        "
                    >
                        Gagal mengambil data aset
                    </td>

                </tr>

            `;

        }

    }


    /* =====================================================
       MULAI
    ===================================================== */

    loadData();
</script>
</body>
</html>
